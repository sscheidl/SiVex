<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Apfelkrieg – SiVex</title>
  <meta name="description" content="Modell Apfelkrieg zum chemischen Gleichgewicht: Großvater und Enkel werfen Äpfel über den Zaun – dynamisches Gleichgewicht mit Zufall auf der Teilchenebene (Chemie Jgst. 10–13).">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231b2430'/%3E%3Ccircle cx='20' cy='38' r='9' fill='%23e0392b'/%3E%3Ccircle cx='44' cy='40' r='9' fill='%23e0392b'/%3E%3Ccircle cx='36' cy='20' r='9' fill='%23e0392b'/%3E%3Crect x='30' y='10' width='4' height='44' fill='%23eef3f8'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="labkit/css/labkit.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="lk-app">
    <header class="lk-head">
      <div class="lk-brand">
        <svg class="brandmark" viewBox="0 0 40 40" aria-hidden="true" focusable="false">
          <circle cx="11" cy="26" r="6" fill="#e0392b"/><circle cx="29" cy="28" r="6" fill="#e0392b"/><circle cx="24" cy="12" r="6" fill="#e0392b"/>
          <rect x="18.5" y="4" width="3" height="32" fill="#eef3f8"/>
        </svg>
        <div><b>Apfelkrieg</b> <span class="ver">0.1.0</span><br><small>Modell zum chemischen Gleichgewicht · Chemie 10–13</small></div>
      </div>
      <button type="button" class="lk-btn small" id="btnNotebook">Hefteintrag</button>
      <button type="button" class="lk-btn small" id="btnPanel" aria-expanded="true" aria-controls="panel">Bedienfeld</button>
    </header>
    <main class="lk-main" id="main">
      <section class="lk-stage" id="stage" aria-label="Versuch">
        <div class="viewrow" id="viewrow">
          <div class="lk-frame particles stagewrap" id="stageWrap">
            <span class="lk-level particles levelTag">Teilchenebene – Modell</span>
            <canvas id="stage-canvas" role="img" aria-label="Zwei Wiesenfelder mit Äpfeln, links der Großvater, rechts der Enkel"></canvas>
          </div>
          <div class="chartcol">
            <div class="chartwrap"><canvas id="chart" role="img" aria-label="Diagramm: Anzahl der Äpfel auf beiden Feldern über der Zeit"></canvas></div>
            <div class="chartfoot">
              <div class="barswrap"><canvas id="bars" role="img" aria-label="Balkenpaar: Würfe pro 10 Sekunden in beide Richtungen"></canvas></div>
              <div class="qbox" id="qbox" aria-live="off"></div>
            </div>
          </div>
        </div>
        <div class="ctrlbar">
          <button type="button" class="lk-btn" id="btnStep">Schritt</button>
          <button type="button" class="lk-btn primary" id="btnRun" aria-pressed="false">Start</button>
          <div class="lk-seg light" id="speed" role="group" aria-label="Tempo">
            <button type="button" data-speed="1" aria-pressed="true">1×</button>
            <button type="button" data-speed="3" aria-pressed="false">3×</button>
            <button type="button" data-speed="10" aria-pressed="false">10×</button>
          </div>
          <button type="button" class="lk-btn" id="btnRestart">Neu starten</button>
          <button type="button" class="lk-btn" id="btnReseed" title="Gleiche Aufstellung, anderer Zufall">Nochmal würfeln</button>
          <span class="hint" id="hint" aria-live="off">Ein Schritt = 0,5 s · jeder Apfel wird einzeln gewürfelt</span>
        </div>
      </section>
      <div class="lk-splitter" id="splitter" role="separator" tabindex="0" aria-orientation="vertical" aria-label="Breite des Bedienfelds ändern (Pfeiltasten, Doppelklick setzt zurück)" aria-valuemin="300" aria-valuemax="620"><span class="lk-splitter-grip"></span></div>
      <aside class="lk-panel" id="panel" aria-label="Bedienfeld">
        <div class="lk-tabs" role="tablist">
          <button type="button" role="tab" id="tab-experiment" data-tab="experiment" aria-selected="true">Versuch</button>
          <button type="button" role="tab" id="tab-task" data-tab="task" aria-selected="false">Aufgabe</button>
          <button type="button" role="tab" id="tab-model" data-tab="model" aria-selected="false">Modell</button>
          <button type="button" role="tab" id="tab-notebook" data-tab="notebook" aria-selected="false">Hefteintrag</button>
        </div>
        <div id="panelBody" class="lk-section" role="tabpanel"></div>
      </aside>
    </main>
  </div>
  <div class="print-only" id="printArea"></div>
  <script src="labkit/js/core.js"></script>
  <script src="labkit/js/splitter.js"></script>
  <script src="labkit/js/scorm.js"></script>
  <script src="labkit/js/chart.js"></script>
  <script src="labkit/js/learn.js"></script>
  <script src="js/model.js"></script>
  <script src="js/render.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
