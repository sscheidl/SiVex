<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Papierchromatographie – SiVex</title>
  <meta name="description" content="Virtuelles Labor: Farbstoffgemische mit Papierchromatographie trennen (Chemie, Jahrgangsstufe 8/9).">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='7' y='3' width='18' height='26' rx='2' fill='%23fbfaf6' stroke='%2366768a'/%3E%3Ccircle cx='16' cy='9' r='3' fill='%23f0c414'/%3E%3Ccircle cx='16' cy='15' r='3' fill='%231e64dc'/%3E%3Ccircle cx='16' cy='21' r='3' fill='%23702ca8'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="labkit/css/labkit.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="lk-app">
    <header class="lk-head">
      <div class="lk-brand">
        <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><rect x="7" y="3" width="18" height="26" rx="2" fill="#fbfaf6"/><circle cx="16" cy="9" r="3" fill="#f0c414"/><circle cx="16" cy="15" r="3" fill="#1e64dc"/><circle cx="16" cy="21" r="3" fill="#702ca8"/></svg>
        <div><b>Papierchromatographie</b><br><small>Farbstoffe trennen · Chemie 8/9</small></div>
      </div>
      <div class="lk-seg" id="speed" role="group" aria-label="Zeitraffer">
        <button type="button" data-speed="0" aria-label="Pause" title="Pause">❚❚</button>
        <button type="button" data-speed="1" aria-label="Echtzeit">1×</button>
        <button type="button" data-speed="10" aria-label="Zeitraffer zehnfach">10×</button>
        <button type="button" data-speed="30" aria-label="Zeitraffer dreißigfach">30×</button>
      </div>
      <span class="clock" id="clock" title="Versuchszeit (Modellzeit)">0:00</span>
      <button type="button" class="lk-btn small" id="btnExpert" aria-pressed="false">Expertenmodus</button>
      <button type="button" class="lk-btn small" id="btnNotebook">Hefteintrag</button>
      <button type="button" class="lk-btn small" id="btnPanel" aria-expanded="true" aria-controls="panel">Bedienfeld</button>
    </header>
    <main class="lk-main" id="main">
      <section class="lk-stage" id="stage" aria-label="Labor">
        <div class="actionbar" id="actions" role="toolbar" aria-label="Handlungen"></div>
        <div class="canvas-wrap" id="canvasWrap">
          <canvas id="lab" role="img" aria-label="Laborbühne mit Arbeitsfläche, Stifteständer, Entwicklungskammer und Laufmittelflaschen"></canvas>
          <div class="hits" id="hits"></div>
          <div class="toast" id="toast" role="status" aria-live="polite"></div>
        </div>
      </section>
      <div class="lk-splitter" id="splitter" role="separator" tabindex="0" aria-orientation="vertical" aria-label="Breite des Bedienfelds ändern (Pfeiltasten, Doppelklick setzt zurück)" aria-valuemin="300" aria-valuemax="620"><span class="lk-splitter-grip"></span></div>
      <aside class="lk-panel" id="panel" aria-label="Bedienfeld">
        <div class="lk-tabs" role="tablist">
          <button type="button" role="tab" id="tab-task" data-tab="task" aria-selected="true">Aufgabe</button>
          <button type="button" role="tab" id="tab-results" data-tab="results" aria-selected="false">Ergebnisse</button>
          <button type="button" role="tab" id="tab-notebook" data-tab="notebook" aria-selected="false">Hefteintrag</button>
        </div>
        <div id="panelBody" class="lk-section" role="tabpanel"></div>
      </aside>
    </main>
  </div>
  <script src="labkit/js/core.js"></script>
  <script src="labkit/js/splitter.js"></script>
  <script src="labkit/js/scorm.js"></script>
  <script src="js/model.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/render.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
