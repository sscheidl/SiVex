<!doctype html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fällungslabor – SiVex</title>
  <meta name="description" content="Fällungslabor – Silberhalogenide und Ionennachweise: Fällung von Chlorid, Bromid und Iodid mit Silbernitratlösung, Ammoniakprüfung und Kontrollversuche (SiVex, Chemie).">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='22' y='4' width='20' height='54' rx='10' fill='%23dbe7f3' stroke='%2346607a' stroke-width='3'/%3E%3Crect x='25' y='36' width='14' height='19' rx='7' fill='%23f1e7c0'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="labkit/css/labkit.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="lk-app">
    <header class="lk-head">
      <div class="lk-brand">
        <svg class="logo" viewBox="0 0 40 40" aria-hidden="true" focusable="false"><rect x="14" y="3" width="12" height="33" rx="6" fill="#dbe7f3" stroke="#8aa3bb" stroke-width="2"/><rect x="16" y="22" width="8" height="12" rx="4" fill="#f1e7c0"/><circle cx="20" cy="18" r="2.4" fill="#fff" opacity=".9"/></svg>
        <div><b>Fällungslabor</b> <span class="ver" id="ver">1.1.0</span><br><small>Silberhalogenide und Ionennachweise</small></div>
      </div>
      <nav class="parts" id="parts" role="tablist" aria-label="Versuchsteil">
        <button type="button" role="tab" id="part-main" data-part="main" aria-selected="true" aria-controls="stage">Fällungsreaktionen</button>
        <button type="button" role="tab" id="part-control" data-part="control" aria-selected="false" aria-controls="stage">Kontrollversuche</button>
      </nav>
      <button type="button" class="lk-btn small" id="btnNotebook" title="Kurzer Hefteintrag – jederzeit erreichbar">Hefteintrag</button>
      <button type="button" class="lk-btn small" id="btnTheme" aria-pressed="false" title="Kontrastschirm hinter den Reagenzgläsern hell oder dunkel – ändert nichts am Versuch">Hintergrund hell</button>
      <button type="button" class="lk-btn small" id="btnPanel" aria-expanded="true" aria-controls="panel">Bedienfeld</button>
    </header>
    <main class="lk-main" id="main">
      <section class="lk-stage" id="stage" aria-label="Laborbühne">
        <div class="canvas-wrap" id="canvasWrap">
          <canvas id="lab" role="img" aria-label="Labortisch mit Vorratsflaschen, Pipetten und Reagenzgläsern im Ständer"></canvas>
          <div class="labels" id="labels"></div>
          <canvas id="fx" class="fx" aria-hidden="true"></canvas>
          <div class="hits" id="hits"></div>
          <div class="forbid" id="forbid" role="alert" hidden>
            <svg viewBox="0 0 40 40" aria-hidden="true" focusable="false"><circle cx="20" cy="20" r="16" fill="#fff" stroke="#c62f3a" stroke-width="5"/><line x1="9" y1="31" x2="31" y2="9" stroke="#c62f3a" stroke-width="5" stroke-linecap="round"/></svg>
            <div><b id="forbidText">Dieser Vorgang entspricht nicht der Experimentieranleitung.</b><span id="forbidReason"></span></div>
          </div>
          <div class="msgband"><div class="toast" id="toast" role="status" aria-live="polite"></div></div>
        </div>
        <div class="deck" id="deck" role="group" aria-label="Bedienleiste">
          <div class="deck-row" id="doseRow"></div>
          <div class="deck-row util">
            <div class="grp" id="volGrp" role="group" aria-label="Probevolumen">
              <span class="glabel">Probe</span>
              <div class="lk-seg light" id="vol"><button type="button" data-vol="1">1 mL</button><button type="button" data-vol="2">2 mL</button><button type="button" data-vol="3">3 mL</button></div>
            </div>
            <button type="button" class="lk-btn small" id="btnShake" title="Gewähltes Reagenzglas schwenken (wirbelt abgesetzten Niederschlag auf)">Schwenken</button>
            <button type="button" class="lk-btn small" id="btnRinse" title="Gewähltes Reagenzglas in den Silberabfall ausgießen und spülen – der Ansatz endet, er bleibt in der Ergebnisübersicht">Spülen</button>
            <span class="tubebtns" role="group" aria-label="Reagenzgläser im Ständer">
              <button type="button" class="lk-btn small" id="btnRemoveTube" title="Gewähltes Reagenzglas aus dem Ständer nehmen (gefüllt: erst ausgießen)">− Glas</button>
              <button type="button" class="lk-btn small" id="btnAddTube" title="Weiteres leeres Reagenzglas in den Ständer stellen (für frische Vergleichsansätze)">+ Glas</button>
            </span>
            <div class="grp" role="group" aria-label="Zeit">
              <span class="glabel">Zeit</span>
              <div class="lk-seg light" id="speed">
                <button type="button" data-speed="0" aria-label="Pause" title="Pause">❚❚</button>
                <button type="button" data-speed="1" aria-label="normale Geschwindigkeit">1×</button>
                <button type="button" data-speed="5" aria-label="Zeitraffer, fünffach" title="Zeitraffer (Absetzen schneller beobachten)">5×</button>
              </div>
            </div>
          </div>
          <p class="deck-hint" id="deckHint" role="status"></p>
        </div>
      </section>
      <div class="lk-splitter" id="splitter" role="separator" tabindex="0" aria-orientation="vertical" aria-label="Breite des Bedienfelds ändern (Pfeiltasten, Pos1 oder Doppelklick setzt zurück)" aria-valuemin="300" aria-valuemax="620"><span class="lk-splitter-grip"></span></div>
      <aside class="lk-panel" id="panel" aria-label="Bedienfeld">
        <div class="lk-tabs" role="tablist" id="ptabs"></div>
        <div id="panelBody" class="lk-section" role="tabpanel"></div>
      </aside>
    </main>
  </div>
  <div class="modal" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle" tabindex="-1">
      <div id="modalBody"></div>
    </div>
  </div>
  <div class="print-only" id="printArea"></div>
  <script src="labkit/js/core.js"></script>
  <script src="labkit/js/splitter.js"></script>
  <script src="labkit/js/scorm.js"></script>
  <script src="labkit/js/learn.js"></script>
  <script src="js/chem.js"></script>
  <script src="js/geometry.js"></script>
  <script src="js/model.js"></script>
  <script src="js/ghs.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/render.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
