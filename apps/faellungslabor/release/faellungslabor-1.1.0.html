/* ============================================================
   SiVex-Labkit 0.3.0 – gemeinsamer Grundstil der SiVex-Apps
   Farben, Schrift, Seitenhülle, Trennlinie, Schaltflächen,
   Reiter und Rückmeldungen. Keine externen Schriften.
   ============================================================ */

:root {
  --bg: #eef2f6;
  --surface: #ffffff;
  --surface-2: #f5f7fa;
  --line: #d9e0e8;
  --line-2: #c3cdd8;
  --text: #17212c;
  --text-2: #3d4b5a;
  --muted: #66768a;
  --head: #1b2430;
  --head-2: #263241;
  --head-text: #eef3f8;
  --accent: #1f6fd1;
  --accent-2: #155bb0;
  --accent-soft: #e5effc;
  --ok: #1c8a4a;
  --ok-soft: #e3f4ea;
  --bad: #c62f3a;
  --bad-soft: #fbe7e8;
  --warn: #a8640a;
  --warn-soft: #fdf1dc;
  --radius: 12px;
  --radius-sm: 8px;
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --panel-w: clamp(300px, 30vw, 380px);
  --touch: 44px;
  --head-h: 52px;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.45 var(--font); }
body { overflow: hidden; -webkit-text-size-adjust: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Seitenhülle ---------- */
.lk-app { display: flex; flex-direction: column; height: 100dvh; height: 100vh; }
@supports (height: 100dvh) { .lk-app { height: 100dvh; } }
.lk-head {
  flex: 0 0 var(--head-h); display: flex; align-items: center; gap: 12px; padding: 0 14px;
  background: var(--head); color: var(--head-text); min-width: 0;
}
.lk-brand { display: flex; align-items: center; gap: 10px; min-width: 0; margin-right: auto; }
.lk-brand b { font-size: 17px; white-space: nowrap; }
.lk-brand small { color: #aab6c4; font-size: 12px; white-space: nowrap; }
.lk-head .lk-btn { background: var(--head-2); border-color: #3a4757; color: var(--head-text); }
.lk-head .lk-btn:hover { background: #304054; }
.lk-head .lk-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
.lk-seg { display: inline-flex; background: var(--head-2); border: 1px solid #3a4757; border-radius: 10px; padding: 2px; }
.lk-seg button { border: 0; background: transparent; color: #c9d3de; min-height: 36px; min-width: 40px; padding: 0 10px; border-radius: 8px; cursor: pointer; font-weight: 600; }
.lk-seg button[aria-pressed="true"] { background: #eef3f8; color: var(--head); }

.lk-main { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 14px var(--panel-w); }
.lk-main.panel-hidden { grid-template-columns: minmax(0, 1fr) 0 0; }
.lk-main.panel-hidden .lk-panel, .lk-main.panel-hidden .lk-splitter { display: none; }
.lk-stage { position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.lk-panel { min-width: 0; min-height: 0; overflow-y: auto; background: var(--surface-2); border-left: 1px solid var(--line); }

/* ---------- Trennlinie (nach TitraLab 3) ---------- */
.lk-splitter { position: relative; cursor: col-resize; touch-action: none; background: var(--surface-2); border-left: 1px solid var(--line); display: grid; place-items: center; z-index: 3; }
.lk-splitter::before { content: ""; position: absolute; inset: 0 -15px; } /* Touch-Fläche 44 px breit */
.lk-splitter-grip { width: 4px; height: 44px; border-radius: 2px; background: var(--line-2); transition: background .15s, height .15s; }
.lk-splitter:hover .lk-splitter-grip, .lk-splitter.is-dragging .lk-splitter-grip, .lk-splitter:focus-visible .lk-splitter-grip { background: var(--accent); height: 64px; }
body.is-resizing { cursor: col-resize; -webkit-user-select: none; user-select: none; }

/* ---------- Schaltflächen ---------- */
.lk-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: var(--touch); padding: 0 14px; border-radius: var(--radius-sm);
  border: 1px solid var(--line-2); background: var(--surface); color: var(--text);
  font-weight: 600; cursor: pointer; text-align: center; line-height: 1.2;
}
.lk-btn:hover { background: var(--accent-soft); }
.lk-btn:disabled { opacity: .5; cursor: default; background: var(--surface); }
.lk-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.lk-btn.primary:hover { background: var(--accent-2); }
.lk-btn.small { min-height: 36px; padding: 0 10px; font-size: 14px; }
.lk-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.lk-row.end { justify-content: flex-end; }

/* ---------- Reiter ---------- */
.lk-tabs { position: sticky; top: 0; z-index: 2; display: flex; gap: 4px; padding: 8px 10px 0; background: var(--surface-2); border-bottom: 1px solid var(--line); }
.lk-tabs button { border: 0; background: transparent; min-height: var(--touch); padding: 0 12px; font-weight: 600; color: var(--text-2); cursor: pointer; border-bottom: 3px solid transparent; }
.lk-tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.lk-section { padding: 12px 14px; }
.lk-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 12px; }
.lk-card h2 { margin: 0 0 6px; font-size: 17px; }
.lk-card h3 { margin: 0 0 6px; font-size: 15px; }
.lk-card p { margin: 0 0 8px; }
.lk-muted { color: var(--muted); }

/* ---------- Rückmeldungen ---------- */
.lk-note { border-radius: var(--radius-sm); padding: 10px 12px; margin: 8px 0; border: 1px solid var(--line); background: var(--surface); }
.lk-note.ok { background: var(--ok-soft); border-color: #a9d8bb; }
.lk-note.bad { background: var(--bad-soft); border-color: #eeb4b8; }
.lk-note.warn { background: var(--warn-soft); border-color: #ecc98d; }
.lk-note.info { background: var(--accent-soft); border-color: #b7d0f2; }
.lk-note ul { margin: 6px 0 0; padding-left: 20px; }

/* ---------- Protokollformular (nach Redoxlabor) ---------- */
.lk-form fieldset { border: 1px solid var(--line); border-radius: var(--radius-sm); margin: 0 0 10px; padding: 8px 10px 10px; background: var(--surface); }
.lk-form legend { font-weight: 700; padding: 0 4px; }
.lk-opt { display: flex; align-items: flex-start; gap: 10px; min-height: var(--touch); padding: 9px 10px; border: 1px solid var(--line); border-radius: var(--radius-sm); margin-top: 6px; cursor: pointer; background: var(--surface); }
.lk-opt input { margin-top: 3px; width: 18px; height: 18px; flex: 0 0 auto; }
.lk-opt.right { border-color: var(--ok); background: var(--ok-soft); }
.lk-opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.lk-mark { margin-left: auto; font-weight: 700; }
.lk-mark.y { color: var(--ok); }
.lk-mark.n { color: var(--bad); }
.lk-fb { margin: 6px 2px 0; font-size: 14px; }
.lk-fb.y { color: var(--ok); }
.lk-fb.n { color: var(--bad); }
.lk-gap { width: 100%; min-height: var(--touch); padding: 8px 10px; border: 1px solid var(--line-2); border-radius: var(--radius-sm); background: #fff; }
.lk-gap.right { border-color: var(--ok); background: var(--ok-soft); }
.lk-gap.wrong { border-color: var(--bad); background: var(--bad-soft); }

/* ---------- Hefteintrag ---------- */
.lk-notebook { background: #fffef8; border: 1px solid #e4dfc8; border-radius: var(--radius); padding: 14px 18px; }
.lk-notebook h2 { margin: 0 0 8px; font-size: 19px; }
.lk-notebook ul { padding-left: 20px; margin: 6px 0; }
.lk-notebook li { margin: 4px 0; }
.lk-notebook .eq { display: block; margin: 8px 0; padding: 6px 10px; background: #f5f2e4; border-radius: 6px; text-align: center; }

/* ---------- Schmale Bildschirme ---------- */
@media (max-width: 899px) {
  body { overflow: auto; }
  .lk-app { height: auto; min-height: 100vh; }
  .lk-main, .lk-main.panel-hidden { display: block; }
  .lk-splitter { display: none; }
  .lk-panel { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
  .lk-main.panel-hidden .lk-panel { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* ---------- Auswahllisten (iPad-Regel 1, Labkit 0.2.0) ----------
   Auswahllisten dürfen schmaler werden als ihr längster Eintrag; Zeilen „Text | Auswahl“ brechen um,
   statt dass die Liste den Text überdeckt. */
.lk-panel select, .lk-card select { max-width: 100%; min-width: 0; text-overflow: ellipsis; }
.lk-panel { overflow-wrap: break-word; }
.lk-choice { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.lk-choice > :first-child { flex: 1 1 12em; min-width: 0; }
.lk-choice > select, .lk-choice > .lk-choice-ctl { flex: 1 1 10em; min-width: 0; max-width: 100%; }
.lk-choice > .lk-choice-ctl { display: inline-flex; align-items: center; gap: 4px; }
.lk-choice > .lk-choice-ctl > select { flex: 1 1 auto; min-width: 0; max-width: 100%; }
.lk-choice > .lk-fb, .lk-choice > .lk-choice-full { flex: 1 1 100%; }

/* ---------- Lernweg (Labkit 0.3.0, js/learn.js) ----------
   Schritt-Chips, Lückentext, Zuordnungszeilen, Tippkasten. Inhalte liefern die Apps. */
.lk-stepchips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
.lk-stepchips button { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px 0 6px; border-radius: 20px; border: 1px solid var(--line-2); background: var(--surface); color: var(--text-2); font-weight: 600; cursor: pointer; }
.lk-stepchips button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.lk-stepchips .num { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2); color: var(--text); font-size: 13px; }
.lk-stepchips button[aria-pressed="true"] .num { background: #fff; color: var(--accent); }
.lk-stepchips .done { color: var(--ok); }
.lk-stepchips button[aria-pressed="true"] .done { color: #fff; }
.lk-stepchips .locked { opacity: .6; }
.lk-cloze p { line-height: 2.1; margin: 0 0 6px; }
.lk-gapw { display: inline-flex; align-items: center; gap: 4px; max-width: 100%; vertical-align: middle; }
.lk-gapw select { min-height: 36px; padding: 2px 6px; border: 1px solid var(--line-2); border-radius: 6px; background: #fff; }
.lk-gapw select.right { border-color: var(--ok); background: var(--ok-soft); }
.lk-gapw select.wrong { border-color: var(--bad); background: var(--bad-soft); }
.lk-fbline { display: block; font-size: 14px; margin: -2px 0 8px; }
.lk-fbline.n { color: var(--bad); }
.lk-arow { padding: 6px 0; border-top: 1px dashed var(--line); }
.lk-arow:first-of-type { border-top: 0; }
.lk-arow select { min-height: 40px; padding: 2px 6px; border: 1px solid var(--line-2); border-radius: 6px; background: #fff; }
.lk-arow select.right { border-color: var(--ok); background: var(--ok-soft); }
.lk-arow select.wrong { border-color: var(--bad); background: var(--bad-soft); }
.lk-tipbox { background: var(--warn-soft); border-color: #ecc98d; }
.lk-tipbox .lvl { font-weight: 700; color: var(--warn); }
.lk-tipbox p { margin: 0 0 6px; }

/* ---------- Ebenen-Etikett (Gleichgewichts-Reihe, G1) ---------- */
.lk-level { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 14px; font-size: 13px; font-weight: 700; letter-spacing: .01em; }
.lk-level.matter { background: #e5effc; color: #155bb0; border: 1px solid #b7d0f2; }
.lk-level.particles { background: #efe6fb; color: #5b2c9e; border: 1px solid #d3bff2; }
.lk-frame.matter { border: 2px solid #8fb3e6; }
.lk-frame.particles { border: 2px solid #b79be0; }

</style>
  <style data-src="css/app.css">
/* ============================================================
   Fällungslabor – app-eigener Stil (auf Basis von labkit.css)
   Hell/dunkel wirkt auf Bühne und Kontrastschirm; Bedienfeld bleibt hell lesbar.
   ============================================================ */
:root {
  --accent: #2f6db3;
  --accent-2: #24568f;
  --accent-soft: #e6eef8;
  --panel-w: clamp(300px, 28vw, 420px);
  --stage-bg: #0f161e;
  --deck-bg: #18222d;
  --deck-text: #e6edf4;
  --deck-line: #2c3a49;
}
:root[data-theme="light"] {
  --stage-bg: #e9eef3;
  --deck-bg: #f6f8fa;
  --deck-text: #17212c;
  --deck-line: #d0d9e2;
}
body { background: var(--bg); }

/* ---------- Kopfzeile ---------- */
.lk-head { gap: 10px; flex-wrap: nowrap; }
.logo { width: 34px; height: 34px; flex: 0 0 34px; }
.ver { font-size: 12px; color: #aab6c4; margin-left: 4px; font-weight: 600; }
.parts { display: flex; gap: 4px; background: var(--head-2); border: 1px solid #3a4757; border-radius: 10px; padding: 2px; }
.parts button { border: 0; background: transparent; color: #c9d3de; min-height: 44px; padding: 0 14px; border-radius: 8px; cursor: pointer; font-weight: 600; white-space: nowrap; }
.parts button[aria-selected="true"] { background: #eef3f8; color: var(--head); }
.lk-head .lk-btn { white-space: nowrap; min-height: 44px; }

/* ---------- Bühne ---------- */
.lk-stage { overflow: hidden; background: var(--stage-bg); }
.canvas-wrap { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; }
.canvas-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.hits, .labels { position: absolute; inset: 0; pointer-events: none; }
.hit { position: absolute; pointer-events: auto; background: transparent; border: 0; padding: 0; margin: 0; cursor: pointer; border-radius: 10px; touch-action: none; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.hit:focus-visible { outline: 3px solid #5ac8ff; outline-offset: 1px; }
.hit.pip { cursor: grab; }
canvas.fx { pointer-events: none; }
/* Flaschenetikett in festen Bildschirmpixeln (1.1.0): Formel groß, Name, Zusatz – ohne Konzentration */
.bcard {
  position: absolute; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
  padding: 3px 2px 26px; border-radius: 6px; background: #fbfaf4; color: #17212c; border: 1px solid rgba(40, 60, 80, .35);
  text-align: center; line-height: 1.12; overflow: hidden; pointer-events: none; -webkit-hyphens: manual; hyphens: manual;
  box-shadow: 0 1px 2px rgba(0, 0, 0, .25);
}
.bcard .f { font-size: 18px; font-weight: 700; letter-spacing: .01em; line-height: 1.15; }
.bcard .n { font-size: 14px; font-weight: 600; overflow-wrap: normal; }
.bcard .n.big { font-size: 15px; font-weight: 700; margin-top: 2px; }
.bcard .q { font-size: 14px; font-weight: 800; color: #0d3c73; margin-top: 1px; letter-spacing: -.025em; }
.bcard.compact { padding: 3px 2px 22px; }
.bcard.tight .n, .bcard.tight .q { font-size: 13px; letter-spacing: -.03em; }
.bcard.compact .n { display: none; }

.binfo { border-radius: 0 0 6px 6px; }

}

}

}

/* Verbotszeichen: kurz, dezent, mit Text */
.forbid {

  padding: 8px 10px; border-radius: 10px; background: rgba(255, 255, 255, .97); color: #17212c; border: 2px solid #c62f3a;

}

.msgband { position: absolute; left: 0; right: 0; bottom: 8px; display: flex; justify-content: center; pointer-events: none; z-index: 4; }

/* ---------- Bedienleiste ---------- */
.deck { flex: 0 0 auto; background: var(--deck-bg); color: var(--deck-text); border-top: 1px solid var(--deck-line); padding: 6px 10px 4px; }

.deck .who > span:last-child, .deck .who b { overflow: hidden; text-overflow: ellipsis; }
.deck .bulb { width: 12px; height: 18px; border-radius: 6px 6px 4px 4px; display: inline-block; border: 1px solid rgba(255, 255, 255, .4); flex: 0 0 auto; }
.deck .lk-btn { min-height: 44px; }
.deck .lk-btn:not(.primary) { background: var(--surface); color: var(--text); }
.dropbtn { min-width: 110px; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.deck .grp { display: inline-flex; align-items: center; gap: 6px; }
.deck .glabel { font-size: 13px; opacity: .8; }
.lk-seg.light { background: var(--surface); border-color: var(--line-2); }

.deck-hint { margin: 2px 0 2px; font-size: 13px; opacity: .85; min-height: 1.2em; }

/* ---------- Bedienfeld ---------- */
.lk-tabs { flex-wrap: wrap; gap: 2px 0; padding: 8px 4px 0; }

.steps-list { padding-left: 20px; margin: 4px 0; }

.small { font-size: 13.5px; }

  <script data-src="labkit/js/core.js">
/*
 * SiVex-Labkit – gemeinsame Grundfunktionen (ohne DOM, ohne Fachlogik)
 *
 * Mathematische Hilfen, feste Zeitschritte für reproduzierbare Simulationen,
 * Ereignisverteiler und die Prüfung eingetippter Fachbegriffe (Lückentexte).

  const VERSION = '0.3.0';
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

  /**
   * Feste Simulationsschritte: Unabhängig von Bildrate und Zeitraffer wird das
   * Modell immer in Schritten von STEP Sekunden Modellzeit fortgeschrieben.
   * Damit verändern Pause und Zeitraffer nur die Geschwindigkeit, nie das Ergebnis.
   */
  const STEP = 0.05;
  function createClock(engine) {
    let carry = 0;
    return {
      /** Modellzeit (s) vorrücken; gibt die Zahl ausgeführter Schritte zurück. */
      advance(simSeconds) {
        carry += simSeconds;
        let n = 0;
        while (carry >= STEP - 1e-9) { engine.step(STEP); carry -= STEP; n++; }

      get carry() { return carry; },
      reset() { carry = 0; }

      .replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')
      .replace(/[\s\-–_.,;:!?"'„“()]+/g, '');
  }
  function levenshtein(a, b) {
    if (a === b) return 0;
    const m = a.length, n = b.length;
    if (!m) return n;
    if (!n) return m;
    let prev = Array.from({ length: n + 1 }, (_, j) => j);
    for (let i = 1; i <= m; i++) {
      const cur = [i];
      for (let j = 1; j <= n; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));

      prev = cur;

  /**
   * Prüft eine Lücke.
   * gap: { accept: [Begriffe/Synonyme], forbid: [{term, hint}], hint }
   * Ergebnis: { status: 'empty'|'correct'|'typo'|'near'|'forbidden'|'wrong', feedback, canonical }
   *  - typo: ein Tippfehler in einem langen Wort – gilt als richtig, Schreibweise wird gezeigt
   *  - near: zwei Fehler – nicht akzeptiert, Hinweis auf die Schreibweise

   */
  function checkGap(gap, input) {

    const canonical = gap.accept[0];
    if (!v) return { status: 'empty', feedback: 'Noch keine Eingabe.', canonical };
    for (const f of gap.forbid || []) {
      if (norm(f.term) === v) return { status: 'forbidden', feedback: f.hint, canonical };
    }
    const acc = gap.accept.map(norm);
    if (acc.includes(v)) return { status: 'correct', feedback: 'Richtig.', canonical };

    for (const a of acc) best = Math.min(best, levenshtein(a, v));

  /**
   * Letzte Eingabeart: Tastatur oder Zeiger/Finger. Safari auf dem iPad öffnet eine Auswahlliste,
   * sobald sie den Fokus bekommt – nach dem Neuaufbau eines Bedienfelds sprang sie so nach dem

    document.addEventListener('keydown', () => noteInput('keyboard'), true);
    document.addEventListener('pointerdown', () => noteInput('pointer'), true);
    document.addEventListener('touchstart', () => noteInput('pointer'), { capture: true, passive: true });

  /**
   * Fokus nach einem Neuaufbau wiederherstellen. Auswahllisten nur nach Tastaturbedienung;
   * Textfelder behalten die Schreibmarke (caret = [Anfang, Ende]). Gibt true zurück, wenn fokussiert.
   */

    if (!el || typeof el.focus !== 'function') return false;
    if (String(el.tagName).toUpperCase() === 'SELECT' && !keyboard) return false;
    try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); }
    if (caret && typeof el.setSelectionRange === 'function') { try { el.setSelectionRange(caret[0], caret[1]); } catch (e) { /* Feld ohne Schreibmarke */ } }
    return true;
  }

  return { VERSION, clamp, lerp, round, clone, easeInOut, fmt, fmtTime, STEP, createClock, norm, levenshtein, checkGap, gapOk, parseNum, emitter, noteInput, lastInputKeyboard, restoreFocus };
});

</script>
  <script data-src="labkit/js/splitter.js">
/*
 * SiVex-Labkit – verschiebbare Trennlinie zwischen Laborbühne und Bedienfeld
 *
 * Nach TitraLab 3 (titration/js/ui/app.js: setPanelWidth, bindSplitter):
 * Maus, Finger, Tastatur (Pfeiltasten), Doppelklick setzt zurück; die Breite
 * wird nur lokal im Browser gemerkt.
 */
(function (root, factory) {
  const api = factory(root);
  if (typeof module === 'object' && module.exports) module.exports = api;
  else (root.LK = root.LK || {}).splitter = api;
})(typeof self !== 'undefined' ? self : this, function (root) {
  'use strict';

  const MIN_PANEL = 300;
  const MAX_PANEL = 620;
  const MIN_STAGE = 420;
  const KEY_STEP = 24;

  /** Erlaubte Bedienfeldbreite bei gegebener Gesamtbreite (minStage: Mindestbreite der Bühne). */
  function clampPanelWidth(w, total, minStage) {
    const max = Math.max(MIN_PANEL, Math.min(MAX_PANEL, total - (minStage || MIN_STAGE)));
    return Math.round(Math.min(max, Math.max(MIN_PANEL, w)));
  }

  /**
   * opts: { splitter, container, panel, storageKey, onChange, minStage (optional, Standard MIN_STAGE) }
   * Die Breite wird als CSS-Variable --panel-w am Wurzelelement gesetzt.
   */
  function bindSplitter(opts) {
    const sp = opts.splitter;
    const doc = sp.ownerDocument;
    const rootEl = doc.documentElement;
    const store = (v) => { try { if (v == null) root.localStorage.removeItem(opts.storageKey); else root.localStorage.setItem(opts.storageKey, String(v)); } catch (e) { /* ohne Speicher */ } };
    const changed = () => { if (opts.onChange) opts.onChange(); };

    function set(w, save) {
      const total = opts.container.getBoundingClientRect().width;
      const width = clampPanelWidth(w, total, opts.minStage);
      rootEl.style.setProperty('--panel-w', width + 'px');
      sp.setAttribute('aria-valuenow', String(width));
      if (save) store(width);
      changed();
      return width;
    }
    function reset() {
      rootEl.style.removeProperty('--panel-w');
      sp.removeAttribute('aria-valuenow');
      store(null);
      changed();
    }

    let dragging = false;
    sp.addEventListener('pointerdown', (e) => {
      dragging = true;
      sp.classList.add('is-dragging');
      doc.body.classList.add('is-resizing');
      try { sp.setPointerCapture(e.pointerId); } catch (err) { /* ignorieren */ }
      e.preventDefault();
    });
    sp.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const box = opts.container.getBoundingClientRect();
      set(box.right - e.clientX - sp.getBoundingClientRect().width / 2, false);
    });
    const end = () => {
      if (!dragging) return;
      dragging = false;
      sp.classList.remove('is-dragging');
      doc.body.classList.remove('is-resizing');
      set(opts.panel.getBoundingClientRect().width, true);
    };
    sp.addEventListener('pointerup', end);
    sp.addEventListener('pointercancel', end);
    sp.addEventListener('dblclick', reset);
    sp.addEventListener('keydown', (e) => {
      if (e.key === 'Home') { e.preventDefault(); reset(); return; }
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      e.preventDefault();
      const cur = opts.panel.getBoundingClientRect().width;
      set(cur + (e.key === 'ArrowLeft' ? KEY_STEP : -KEY_STEP), true);
    });

    let saved = null;
    try { saved = parseFloat(root.localStorage.getItem(opts.storageKey)); } catch (e) { /* ohne Speicher */ }
    if (saved) set(saved, false);
    return { set, reset };
  }

  return { bindSplitter, clampPanelWidth, MIN_PANEL, MAX_PANEL, MIN_STAGE, KEY_STEP };

</script>

    if (key === 'agno3') return null;
    if (key === 'nh3dil' || key === 'nh3conc') return t.log.agV > 0 ? null : 'Ammoniaklösung kommt erst zu einem Ansatz mit Silbernitratlösung.';
    if (key === 'water') return null;
    return 'Dieser Vorgang ist hier nicht vorgesehen.';
  }

  // ------------------------------------------------------------------ Labor (Bedienablauf)
  function makeTab(id) {
    const cfg = TABS[id];
    return { id, counter: 0, visible: cfg.startTubes, sel: null, tubes: Array.from({ length: cfg.maxTubes }, (_, i) => makeTube(i)), archive: [], waste: emptyWaste() };
  }

  function emptyWaste() { return { V: 0, Na: 0, NO3: 0, Ag: 0, X: 0, N: 0, F: 0, solid: 0 }; }
  /** Glas aus dem Ständer nehmen: nachfolgende Gläser rücken auf, Kennungen wandern mit ihrem Inhalt. */
  function spliceTube(tb, slot) {
    tb.tubes.splice(slot, 1);
    tb.tubes.push(makeTube(tb.tubes.length));
    tb.tubes.forEach((t, i) => { t.slot = i; });
    tb.visible = Math.max(1, tb.visible - 1);
    if (tb.sel === slot) tb.sel = Math.min(slot, tb.visible - 1);
    else if (tb.sel != null && tb.sel > slot) tb.sel--;
  }

  function create(saved) {
    const st = {
      v: 1, time: 0, speed: 1, tab: 'main', worldW: 1000, scale: 0.6,
      tabs: { main: makeTab('main'), control: makeTab('control') },
      sampleVol: { main: 2, control: 2 },
      pip: { key: null, tab: null, phase: 'rest', x: 0, y: 0, from: null, to: null, t: 0, dur: 0, over: null, content: 0, next: null },
      drops: [], hold: null, stream: null, burst: null, lastDrop: -1, uid: 1, events: [], pour: null, reduced: false
    };
    if (saved) restore(st, saved);

    const tabState = (id) => st.tabs[id || st.tab];
    const cfg = (id) => TABS[id || st.tab];
    const emit = (type, data) => { st.events.push(Object.assign({ type }, data || {})); if (st.events.length > 50) st.events.shift(); };
    const busy = () => !!st.pour || !!st.pip.autoReturn || st.pip.phase === 'move' || st.pip.phase === 'lift' || st.pip.phase === 'back' || !!st.stream || !!st.hold || !!st.burst || st.drops.length > 0 ||
      Object.values(st.tabs).some((tb) => tb.tubes.some((t) => t.shake > 0));
    /** Bedienen beendet die Pause (SiVex-Regel 4). */
    function wake() { if (st.speed === 0) { st.speed = 1; emit('toast', { text: 'Pause beendet – die Zeit läuft wieder mit 1×.' }); } }

    // ---------------- Positionen
    function layout(tab) { return G.bottleLayout(tab || st.tab, st.worldW, st.scale); }
    function bottlePos(key, tab) { const b = layout(tab).bottles[key]; return b ? b.x : st.worldW / 2; }
    function tubePos(slot, tab) { const tb = tabState(tab); return G.tubeX(slot, tb.visible, st.worldW); }
    function restPos(key, tab) { const b = layout(tab).bottles[key]; const p = G.pipetteRest(b ? b.x : st.worldW / 2, b && b.h); return { x: p.x, y: p.y }; }
    function heldPos(key, tab) { const p = restPos(key, tab); return { x: p.x, y: p.y - G.LIFT }; }
    function overPos(slot, tab) { const p = G.pipetteOver(tubePos(slot, tab)); return { x: p.x, y: p.y }; }
    function moveTo(to, phase, then) {
      const p = st.pip;
      const d = Math.hypot(to.x - p.x, to.y - p.y);
      Object.assign(p, { phase, from: { x: p.x, y: p.y }, to, t: 0, dur: Math.max(T.minMove, d / T.moveSpeed), next: then || null });
    }
    function placePipette() {
      const p = st.pip;
      if (!p.key) return;
      if (p.phase === 'over' && p.over != null) Object.assign(p, overPos(p.over, p.tab));
      else if (p.phase === 'held') Object.assign(p, heldPos(p.key, p.tab));
    }

    // ---------------- Pipette
    function stopFlow() { st.hold = null; st.stream = null; st.burst = null; }
    function forbidden(reason) {
      const p = st.pip;
      emit('forbidden', { text: 'Dieser Vorgang entspricht nicht der Experimentieranleitung.', reason, x: p.x, y: p.y });
    }
    /** Flasche antippen: Pipette aufnehmen; erneutes Antippen der gleichen Flasche stellt sie zurück. */
    function selectBottle(key) {
      if (!cfg().bottles.includes(key)) return false;
      wake();
      const p = st.pip;
      if (p.key === key && p.tab === st.tab) { returnPipette(); return true; }
      if (p.key) { stopFlow(); landAll(); }
      p.autoReturn = false;
      const r = restPos(key, st.tab);
      Object.assign(p, { key, tab: st.tab, over: null, x: r.x, y: r.y, content: 1 });
      moveTo(heldPos(key, st.tab), 'lift', 'held');
      return true;
    }
    /** Pipetteninhalt in eine Vorratsflasche geben: nicht vorgesehen, kein Stofftransfer. */
    function toBottle(key) {
      if (!st.pip.key || st.pip.tab !== st.tab) return false;
      wake();
      forbidden(key === st.pip.key ? 'Die Pipette wird nur zum Zugeben in Reagenzgläser benutzt.' : 'Lösungen werden nicht in Vorratsflaschen umgefüllt.');
      return false;
    }
    function returnPipette() {
      const p = st.pip;
      p.autoReturn = false;
      if (!p.key) return;
      stopFlow();
      moveTo(restPos(p.key, p.tab), 'back', 'rest');
    }
    /** Reagenzglas als Ziel wählen. Proben laufen sofort mit dem eingestellten Volumen aus. */
    function target(slot) {
      const tb = tabState();
      const t = tb.tubes[slot];
      if (!t || slot >= tb.visible) return false;
      tb.sel = slot;
      const p = st.pip;
      if (st.pour && st.pour.tab === st.tab && st.pour.slot === slot) { emit('toast', { text: 'Dieses Glas wird gerade ausgegossen.' }); return false; }
      if (!p.key || p.tab !== st.tab) return 'select';
      wake();
      const reason = rule(st.tab, p.key, t);
      if (reason) { forbidden(reason); return false; }
      if (p.phase === 'over' && p.over === slot) {
        if (isSampleKey(p.key)) return startSample(slot);
        return dropOnce();
      }
      stopFlow();
      p.autoReturn = false;
      p.over = slot;
      moveTo(overPos(slot, st.tab), 'move', 'over');
      if (isSampleKey(p.key)) p.pending = { kind: 'sample' }; else p.pending = null;
      return true;
    }
    const isSampleKey = (key) => cfg().samples.includes(key);
    function ready() { const p = st.pip; return p.key && p.tab === st.tab && p.phase === 'over' && p.over != null; }
    function inflight(tab, slot) { return st.drops.filter((d) => d.tab === tab && d.slot === slot).reduce((s, d) => s + d.vol, 0); }
    function fits(slot, vol) {
      const t = tabState(st.pip.tab).tubes[slot];
      return t.V + inflight(st.pip.tab, slot) + vol <= C.CAPACITY_ML + 1e-9;
    }
    function full() { stopFlow(); emit('full', { slot: st.pip.over, text: 'Reagenzglas ist voll.' }); }
    function release(stream) {
      const p = st.pip;
      const t = tabState(p.tab).tubes[p.over];
      const reason = rule(p.tab, p.key, t);
      if (reason) { stopFlow(); forbidden(reason); return false; }
      if (!fits(p.over, C.DROP_ML)) { full(); return false; }
      if (!t.ansatz && isSampleKey(p.key)) { const tb = tabState(p.tab); tb.counter++; t.ansatz = TABS[p.tab].prefix + tb.counter; }
      const xoff = stream ? 0 : (Math.random() - 0.5) * 0.18;
      st.drops.push({ id: st.uid++, tab: p.tab, slot: p.over, key: p.key, vol: C.DROP_ML, t: 0, x: p.x, y0: p.y + 8, xoff, stream: !!stream });
      st.lastDrop = st.time;
      p.squeeze = 1;
      return true;
    }
    /** Ein Tropfen (Tippen). Schnelles Tippen wird auf das Mindestintervall begrenzt. */
    function dropOnce() {
      if (!ready() || isSampleKey(st.pip.key)) return false;
      wake();
      if (st.stream || st.burst) return false;
      if (st.time - st.lastDrop < T.tapMin) return false;
      return release(false);
    }
    /** Gedrückthalten: erster Tropfen sofort, dann begrenzte Folge einzelner Tropfen. */
    function startHold() {
      if (!ready() || isSampleKey(st.pip.key)) return false;
      wake();
      if (st.hold || st.stream || st.burst) return false;
      const ok = st.time - st.lastDrop >= T.tapMin ? release(false) : true;
      if (ok) st.hold = { next: st.time + T.holdFirst };
      return ok;
    }
    function stopHold() { st.hold = null; }
    /** Mehrere Tropfen nacheinander (z. B. 5 Tropfen für vergleichbare Mengen). */
    function drops(n) {
      if (!ready() || isSampleKey(st.pip.key)) return false;
      wake();
      if (st.hold || st.stream || st.burst) return false;
      if (!release(false)) return false;
      if (n > 1) st.burst = { left: n - 1, next: st.time + T.holdEvery };
      return true;
    }
    /** Dosierhilfe: größere Menge (mL) sichtbar als Strahl aus der Pipette. */
    function dose(vol) {
      if (!ready() || isSampleKey(st.pip.key)) return false;
      wake();
      if (st.hold || st.stream || st.burst) return false;
      st.stream = { left: Math.round(vol / C.DROP_ML), rate: T.flowHelper, acc: 0 };
      return true;
    }
    function startSample(slot) {
      const p = st.pip;
      if (st.stream) return false;
      const t = tabState(p.tab).tubes[slot];
      const reason = rule(p.tab, p.key, t);
      if (reason) { forbidden(reason); return false; }
      const vol = st.sampleVol[p.tab] || 2;
      if (!fits(slot, vol)) { full(); return false; }
      st.stream = { left: Math.round(vol / C.DROP_ML), rate: T.flowSample, acc: 0, sample: true };
      return true;
    }

    // ---------------- Tropfen und Buchung beim Eintreffen
    function landDrop(d) {
      const t = st.tabs[d.tab].tubes[d.slot];
      const formed = book(d.tab, t, d.key, d.vol, d.xoff);
      emit('land', { tab: d.tab, slot: d.slot, key: d.key, vol: d.vol, xoff: d.xoff, stream: d.stream, formed });
    }
    /** Alle Tropfen im Flug sofort ankommen lassen (Handgriff abschließen). */
    function landAll() { const ds = st.drops; st.drops = []; for (const d of ds) landDrop(d); }

    function stepPipette(dt) {
      const p = st.pip;
      // Nach dem Abgeben einer Probe kehrt die Messpipette selbst in ihre Flasche zurück,
      // sobald der letzte Anteil angekommen ist (erneutes Antippen des Glases wählt es dann nur aus)
      if (p.autoReturn && p.phase === 'over' && !st.drops.some((d) => d.tab === p.tab && d.key === p.key)) { p.autoReturn = false; moveTo(restPos(p.key, p.tab), 'back', 'rest'); }
      if (p.squeeze > 0) p.squeeze = Math.max(0, p.squeeze - dt * 5);
      if (p.phase === 'lift' || p.phase === 'move' || p.phase === 'back') {
        p.t += dt;
        const k = Math.min(1, p.t / p.dur);
        const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
        const lift = p.phase === 'move' ? Math.sin(Math.PI * k) * 40 : 0;
        p.x = p.from.x + (p.to.x - p.from.x) * e;
        p.y = p.from.y + (p.to.y - p.from.y) * e - lift;
        if (k >= 1) {
          const nx = p.next;
          p.phase = nx || 'held';
          if (p.phase === 'rest') { p.key = null; p.tab = null; p.over = null; p.content = 0; }
          if (p.phase === 'over' && p.pending && p.pending.kind === 'sample') { p.pending = null; startSample(p.over); }
        }
      }
    }
    function stepFlow(dt) {
      if (!ready()) { st.hold = null; st.burst = null; st.stream = null; return; }
      if (st.hold && st.time >= st.hold.next) { if (release(false)) st.hold && (st.hold.next = st.time + T.holdEvery); }
      if (st.burst && st.time >= st.burst.next) {
        if (release(false)) { st.burst.left--; st.burst.next = st.time + T.holdEvery; if (st.burst.left <= 0) st.burst = null; } else st.burst = null;
      }
      if (st.stream) {
        const s = st.stream;
        s.acc += dt * s.rate;
        while (st.stream && s.acc >= C.DROP_ML - 1e-12 && s.left > 0) {
          s.acc -= C.DROP_ML;
          if (!release(true)) break;
          s.left--;
        }
        if (st.stream && s.left <= 0) { st.stream = null; if (s.sample) st.pip.autoReturn = true; }
      }
    }
    function stepDrops(dt) {
      const keep = [];
      for (const d of st.drops) {
        d.t += dt;
        const t = st.tabs[d.tab].tubes[d.slot];
        const fall = 0.5 * G.GRAV * d.t * d.t;
        d.y = d.y0 + fall;
        if (d.y >= G.surfaceY(t.V)) landDrop(d); else keep.push(d);
      }
      st.drops = keep;
    }

    /** Zeitschritt in Echtzeit-Sekunden; Pause und Zeitraffer wirken hier. */
    function step(dtReal) {
      const dtr = Math.min(0.1, Math.max(0, dtReal));
      const speed = busy() ? Math.min(st.speed, 1) : st.speed;
      const dt = dtr * speed;
      if (!(dt > 0)) return 0;
      // feste Teilschritte für reproduzierbare Abläufe
      const n = Math.max(1, Math.ceil(dt / 0.02));
      const h = dt / n;
      for (let i = 0; i < n; i++) {
        st.time += h;
        stepPipette(h);
        stepFlow(h);
        stepDrops(h);
        stepPour(h);
        for (const id of Object.keys(st.tabs)) for (const t of st.tabs[id].tubes) stepTube(t, h);
      }
      return dt;
    }

    // ---------------- Weitere Handgriffe
    function shake(slot) {
      const tb = tabState();
      const t = tb.tubes[slot];
      if (!t || isEmpty(t) || pourBusy(st.tab, slot)) return false;
      wake();
      tb.sel = slot;
      shakeTube(t);
      return true;
    }
    // ---------------- Ausgießen (Spülen bzw. Entfernen eines gefüllten Glases)
    const pourBusy = (tab, slot) => !!st.pour && st.pour.tab === tab && st.pour.slot === slot;
    /** Dosierungen in dieses Glas beenden; Tropfen im Flug kommen noch an (vor Slot-Änderungen). */
    function releaseTube(tab, slot) {
      const p = st.pip;
      if (p.tab === tab && p.over === slot) stopFlow();
      landAll();
      if (p.tab === tab && p.over === slot && (p.phase === 'over' || p.phase === 'move')) { p.autoReturn = false; p.over = null; p.pending = null; p.phase = 'held'; placePipette(); }
    }
    /** Inhalt anteilig in den Silberabfall: Rest r (0…1) des Anfangsinhalts bleibt im Glas. */
    function drainTo(pr, r) {
      const t = st.tabs[pr.tab].tubes[pr.slot], w = st.tabs[pr.tab].waste, c = pr.content;
      const keep = Math.max(0, Math.min(1, r));
      const out = (pr.left - keep);
      if (!(out > 0)) return;
      w.V += c.V * out; w.solid += c.solid * out;
      for (const k of Object.keys(c.n)) w[k] += c.n[k] * out;
      pr.left = keep;
      t.V = c.V * keep;
      for (const k of Object.keys(c.n)) t.n[k] = c.n[k] * keep;
      t.susp = c.solid * keep; t.sed = 0; t.clouds = []; t.front = 0;
      t.rev++;
    }
    /** Handgriff abschließen: Glas exakt leer, Rest in den Abfall, ggf. Glas entfernen. */
    function finishPour() {
      const pr = st.pour;
      if (!pr) return false;
      drainTo(pr, 0);
      const tb = st.tabs[pr.tab];
      tb.tubes[pr.slot] = makeTube(pr.slot);
      st.pour = null;
      if (pr.remove) {
        spliceTube(tb, pr.slot);
        if (st.pip.tab === pr.tab && st.pip.over != null && st.pip.over > pr.slot) st.pip.over--;
        emit('removed', { tab: pr.tab, slot: pr.slot });
      }
      emit('poured', { tab: pr.tab, slot: pr.slot, ansatz: pr.ansatz, remove: !!pr.remove });
      if (st.pip.tab === pr.tab) placePipette();
      return true;
    }
    function stepPour(dt) {
      const pr = st.pour;
      if (!pr) return;
      pr.t += dt;
      const k = pr.t / pr.dur;
      // Ausgießphase: bei voller Bewegung 25–70 % der Dauer, sonst gleichmäßig
      const a = st.reduced ? 0 : 0.25, b = st.reduced ? 1 : 0.7;
      drainTo(pr, 1 - Math.max(0, Math.min(1, (k - a) / (b - a))));
      if (k >= 1) finishPour();
    }
    /**
     * Ausgießen beginnen. Archiviert den Ansatz genau einmal (beim Start), kippt den Feststoff mit
     * auf (Schräglage), Stoffmengen fließen anteilig in den Silberabfall. remove: Glas danach entfernen.
     */
    function pour(slot, opts) {
      const tb = tabState(), t = tb.tubes[slot];
      if (!t || slot >= tb.visible || isEmpty(t) || st.pour) return false;
      if (opts && opts.remove && tb.visible <= 1) return false;
      wake();
      releaseTube(st.tab, slot);
      const solid = solidTotal(t);
      tb.archive.push({ ansatz: t.ansatz, sample: t.sample, log: Object.assign({}, t.log), rev: t.rev, ended: Math.round(st.time), content: { V: t.V, n: Object.assign({}, t.n), solid } });
      shakeTube(t); t.shake = 0;
      st.pour = { tab: st.tab, slot, t: 0, dur: st.reduced ? T.pourReduced : T.pour, remove: !!(opts && opts.remove), ansatz: t.ansatz, left: 1, content: { V: t.V, n: Object.assign({}, t.n), solid } };
      tb.sel = slot;
      return true;
    }
    /** Spülen = Ausgießen in den Silberabfall; der Ansatz bleibt in der Ergebnisübersicht. */
    function rinse(slot) { return pour(slot, { remove: false }); }
    /**
     * „− Glas“: leeres Glas sofort entfernen; gefülltes nur mit confirmed (sonst 'confirm') und
     * dann über das Ausgießen. Mindestens ein Glas bleibt; Ergebnis 'min' am Minimum.
     */
    function removeTube(slot, confirmed) {
      const tb = tabState(), t = tb.tubes[slot];
      if (slot == null || !t || slot >= tb.visible) return false;
      if (tb.visible <= 1) return 'min';
      if (st.pour) return false;
      if (!isEmpty(t)) return confirmed ? pour(slot, { remove: true }) : 'confirm';
      wake();
      releaseTube(st.tab, slot);
      const p = st.pip;
      spliceTube(tb, slot);
      if (p.tab === st.tab && p.over != null && p.over > slot) p.over--;
      placePipette();
      emit('removed', { tab: st.tab, slot });
      return true;
    }
    function addTube() {
      const tb = tabState();
      if (tb.visible >= TABS[st.tab].maxTubes) return false;
      tb.visible++;
      placePipette();
      return true;
    }
    function setTab(id) {
      if (!TABS[id] || id === st.tab) return false;
      // laufenden Handgriff abschließen, Pipette zurück, Zeit 1×
      stopFlow(); landAll(); finishPour();
      if (st.pip.key) Object.assign(st.pip, { key: null, tab: null, phase: 'rest', over: null, content: 0 });
      if (st.speed === 0) st.speed = 1;
      st.tab = id;
      return true;
    }
    function setSpeed(v) { if (SPEEDS.includes(v)) { st.speed = v; return true; } return false; }
    function setSampleVol(v) { if (SAMPLE_VOLUMES.includes(v)) { st.sampleVol[st.tab] = v; return true; } return false; }
    /** Weltbreite und Maßstab der Bühne (Bildschirmpixel je Welteinheit) – bestimmen die Flaschenlage. */
    function setWorldWidth(W, scale) {
      const sc = scale > 0 ? scale : st.scale;
      if (Math.abs(W - st.worldW) > 0.5 || Math.abs(sc - st.scale) > 1e-6) { st.worldW = W; st.scale = sc; placePipette(); }
    }
    /** Alle Abbruchwege (Loslassen, Abbruch, Fokusverlust, Tabwechsel) enden hier. */
    function cancelInput() { st.hold = null; st.burst = null; }
    /** Fokusverlust oder verborgener Tab: jede Dosierung endet, Tropfen im Flug kommen an. */
    function cancelAll() { stopFlow(); landAll(); finishPour(); }
    function setReducedMotion(v) { st.reduced = !!v; }
    function drain() { const e = st.events; st.events = []; return e; }

    function snapshot() {
      const tabs = {};
      for (const id of Object.keys(st.tabs)) {
        const tb = st.tabs[id];
        const copy = { counter: tb.counter, visible: tb.visible, sel: tb.sel, archive: tb.archive.slice(), waste: Object.assign({}, tb.waste), tubes: tb.tubes.map((t) => {
          const o = JSON.parse(JSON.stringify(t)); delete o._eqRev; delete o._pEq; o.clouds = []; o.susp = t.susp + t.clouds.reduce((s, c) => s + c.m, 0); o.shake = 0; return o;
        }) };
        // laufendes Ausgießen gilt im Speicher als abgeschlossen (bereits archiviert, Rest im Abfall)
        const pr = st.pour;
        if (pr && pr.tab === id) {
          const c = pr.content;
          copy.waste.V += c.V * pr.left; copy.waste.solid += c.solid * pr.left;
          for (const k of Object.keys(c.n)) copy.waste[k] += c.n[k] * pr.left;
          copy.tubes[pr.slot] = makeTube(pr.slot);
          if (pr.remove) {
            copy.tubes.splice(pr.slot, 1); copy.tubes.push(makeTube(copy.tubes.length)); copy.tubes.forEach((t, i) => { t.slot = i; });
            copy.visible = Math.max(1, copy.visible - 1);
            if (copy.sel === pr.slot) copy.sel = Math.min(pr.slot, copy.visible - 1); else if (copy.sel != null && copy.sel > pr.slot) copy.sel--;
          }
        }
        tabs[id] = copy;
      }
      return { v: 1, time: st.time, tab: st.tab, speed: st.speed === 0 ? 1 : st.speed, sampleVol: st.sampleVol, tabs };
    }

    return {
      state: st, TABS, busy, selectBottle, returnPipette, toBottle, target, dropOnce, startHold, stopHold, drops, dose, shake, rinse, pour, removeTube, addTube,
      setTab, setSpeed, setSampleVol, setWorldWidth, setReducedMotion, cancelInput, cancelAll, finishPour, step, drain, snapshot, landAll, pourBusy,
      tube: (slot, tab) => tabState(tab).tubes[slot], tab: (id) => tabState(id),
      tubePos, bottlePos, overPos, restPos, inflight, ready, layout
    };
  }

  /** Gespeicherten Zustand übernehmen (stabil: keine Tropfen im Flug, Pipetten in den Flaschen, nicht pausiert). */
  function restore(st, s) {
    if (!s || s.v !== 1 || !s.tabs) return;
    st.time = +s.time || 0;
    st.tab = TABS[s.tab] ? s.tab : 'main';
    st.speed = SPEEDS.includes(s.speed) && s.speed > 0 ? s.speed : 1;
    if (s.sampleVol) for (const k of Object.keys(TABS)) if (SAMPLE_VOLUMES.includes(s.sampleVol[k])) st.sampleVol[k] = s.sampleVol[k];
    for (const id of Object.keys(TABS)) {
      const src = s.tabs[id];

  /** FNV-1a über Zeichenkette → 32 bit. */

    toScreen(x, y) { const v = this.view; return { x: v.ox + x * v.scale, y: v.oy + y * v.scale }; }
    toWorld(px, py) { const v = this.view; return { x: (px - v.ox) / v.scale, y: (py - v.oy) / v.scale }; }

    tubeFx(tab, slot) {
      const k = tab + slot;
      if (!this.fx[k]) this.fx[k] = { h: new Float32Array(WAVE_N), v: new Float32Array(WAVE_N), rings: [], specks: makeSpecks(slot * 7 + (tab === 'main' ? 1 : 101)) };
      return this.fx[k];
    }

    /** Auftreffen (aus model-Ereignissen): Oberflächenimpuls, Ringwelle, Spritzer. */
    onLand(e) {
      if (e.tab !== this.lab.state.tab) return;
      const f = this.tubeFx(e.tab, e.slot);
      const t = this.lab.tube(e.slot);
      const x = this.lab.tubePos(e.slot) + (e.xoff || 0) * G.TUBE_R;
      if (this.reduceMotion) return;
      const idx = clamp(Math.round(((e.xoff || 0) + 1) / 2 * (WAVE_N - 1)), 2, WAVE_N - 3);
      const s = e.stream ? 6 : 18;
      for (let k = -3; k <= 3; k++) f.v[idx + k] += s * Math.exp(-(k * k) / 3);
      if (!e.stream || Math.random() < 0.25) f.rings.push({ x, age: 0, life: 0.8 });
      if (!e.stream) for (let n = 0; n < 2; n++) this.splashes.push({ x, y: G.surfaceY(t.V), vx: (Math.random() - 0.5) * 70, vy: -100 - Math.random() * 70, age: 0, life: 0.3, tab: e.tab });
    }

    update(dt) {
      this.time += dt;
      const st = this.lab.state;
      for (let slot = 0; slot < this.lab.tab().visible; slot++) {
        if (this.pouringSlot() === slot) continue;
        const f = this.tubeFx(st.tab, slot);
        const h = f.h, v = f.v;
        const sub = Math.max(2, Math.ceil(dt / 0.004)), sdt = dt / sub;
        for (let k = 0; k < sub; k++) {
          for (let j = 0; j < WAVE_N; j++) {
            const l = h[j > 0 ? j - 1 : 1], r = h[j < WAVE_N - 1 ? j + 1 : WAVE_N - 2];
            v[j] += (1700 * (l + r - 2 * h[j]) - 4.2 * v[j] - 40 * h[j]) * sdt;
          }
          for (let j = 0; j < WAVE_N; j++) { v[j] = clamp(v[j], -140, 140); h[j] = clamp(h[j] + v[j] * sdt, -4, 4); }
        }
        f.rings = f.rings.filter((r) => { r.age += dt; return r.age < r.life; });
      }
      this.splashes = this.splashes.filter((p) => { p.age += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 1500 * dt; return p.age < p.life && p.tab === st.tab; });
    }

    frame(dt) {
      this.resize();
      this.update(dt);
      const ctx = this.ctx, v = this.view;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      if (!this.bg) this.renderBackground();
      ctx.drawImage(this.bg, 0, 0);
      const T = [v.scale * v.dpr, 0, 0, v.scale * v.dpr, v.ox * v.dpr, v.oy * v.dpr];
      ctx.setTransform(...T);
      const tb = this.lab.tab();
      // Bewegungsebene leeren (ohne eigene Ebene wird alles in die Grundebene gezeichnet)
      let top = ctx;
      if (this.fxCtx) { top = this.fxCtx; top.setTransform(1, 0, 0, 1, 0, 0); top.clearRect(0, 0, this.fxCanvas.width, this.fxCanvas.height); top.setTransform(...T); }
      this.drawBottles(ctx);
      this.drawRack(ctx, false);
      const ps = this.pouringSlot();
      for (let i = 0; i < tb.visible; i++) if (i !== ps) this.drawTube(ctx, tb.tubes[i], i, tb.sel === i);
      this.drawRack(ctx, true);
      this.drawWaste(ctx);
      if (ps != null) this.drawPour(top);
      this.drawDrops(top);
      this.drawPipette(top);
      top.fillStyle = this.P.splash;
      for (const p of this.splashes) { top.beginPath(); top.arc(p.x, p.y, 1.6, 0, Math.PI * 2); top.fill(); }
    }
    /** Glas, das gerade sichtbar ausgegossen wird (bei reduzierter Bewegung bleibt es im Ständer). */
    pouringSlot() {
      const st = this.lab.state, pr = st.pour;
      return pr && pr.tab === st.tab && !st.reduced ? pr.slot : null;
    }

    renderBackground() {
      const c = this.bg || document.createElement('canvas');
      c.width = this.canvas.width; c.height = this.canvas.height;
      const ctx = c.getContext('2d'), v = this.view, P = this.P;
      const W = c.width, Hh = c.height;
      const wall = ctx.createLinearGradient(0, 0, 0, Hh);
      wall.addColorStop(0, P.wall0); wall.addColorStop(1, P.wall1);
      ctx.fillStyle = wall; ctx.fillRect(0, 0, W, Hh);
      ctx.setTransform(v.scale * v.dpr, 0, 0, v.scale * v.dpr, v.ox * v.dpr, v.oy * v.dpr);
      const Ww = v.worldW;
      // Fliesen
      ctx.strokeStyle = P.tile; ctx.lineWidth = 1.2;
      for (let x = 0; x < Ww; x += 60) { ctx.beginPath(); ctx.moveTo(x, -200); ctx.lineTo(x, G.BENCH); ctx.stroke(); }
      for (let y = G.BENCH; y > -200; y -= 60) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(Ww, y); ctx.stroke(); }
      // Kontrastschirm hinter den Reagenzgläsern
      const tb = this.lab.tab();
      const x0 = G.tubeX(0, tb.visible, Ww) - G.TUBE_GAP / 2 - 6, x1 = G.tubeX(tb.visible - 1, tb.visible, Ww) + G.TUBE_GAP / 2 + 6;
      const top = G.RIM_Y - 70;
      const bd = ctx.createLinearGradient(0, top, 0, G.BENCH);
      bd.addColorStop(0, P.board0); bd.addColorStop(1, P.board1);
      ctx.fillStyle = bd; rr(ctx, x0, top, x1 - x0, G.BENCH - top - 4, 14); ctx.fill();
      ctx.strokeStyle = P.boardEdge; ctx.lineWidth = 2; ctx.stroke();
      // Regalbrett für die Flaschen
      const sh = ctx.createLinearGradient(0, G.SHELF_Y, 0, G.SHELF_Y + 16);
      sh.addColorStop(0, P.shelf0); sh.addColorStop(1, P.shelf1);
      ctx.fillStyle = sh; ctx.fillRect(10, G.SHELF_Y, Ww - 20, 14);
      ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.fillRect(10, G.SHELF_Y + 14, Ww - 20, 6);
      // Tisch
      const bench = ctx.createLinearGradient(0, G.BENCH, 0, G.BENCH + 120);
      bench.addColorStop(0, P.bench0); bench.addColorStop(1, P.bench1);
      ctx.fillStyle = bench; ctx.fillRect(-50, G.BENCH, Ww + 100, 400);
      ctx.strokeStyle = P.benchEdge; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-50, G.BENCH + 1); ctx.lineTo(Ww + 50, G.BENCH + 1); ctx.stroke();
      this.bg = c;
    }

    // ------------------------------------------------------------ Flaschen und Pipetten
    drawBottles(ctx) {
      const st = this.lab.state, keys = M.TABS[st.tab].bottles, B = G.BOTTLE, P = this.P;
      const L = this.lab.layout();
      keys.forEach((key) => {
        const b = L.bottles[key], x = b.x, y = G.SHELF_Y, bw = b.w, bh = b.h;
        const brown = key === 'agno3';
        // Körper (das Etikett mit Name, Formel und Piktogrammen liegt als HTML darüber)
        const bx = x - bw / 2, by = y - bh, rad = Math.min(12, bw * 0.14);
        ctx.fillStyle = P.shadow; ctx.beginPath(); ctx.ellipse(x, y + 2, bw / 2 + 4, 5, 0, 0, Math.PI * 2); ctx.fill();
        const g = ctx.createLinearGradient(bx, 0, bx + bw, 0);
        const tint = brown ? [120, 62, 18] : [200, 222, 240];
        g.addColorStop(0, rgba(tint, brown ? 0.85 : 0.28)); g.addColorStop(0.5, rgba(tint, brown ? 0.6 : 0.10)); g.addColorStop(1, rgba(tint, brown ? 0.9 : 0.30));
        ctx.fillStyle = g; rr(ctx, bx, by, bw, bh, rad); ctx.fill();
        ctx.fillStyle = brown ? 'rgba(200,150,90,0.30)' : rgba(P.liquid, 0.28);
        rr(ctx, bx + 3, by + bh * 0.06, bw - 6, bh * 0.92, rad * 0.8); ctx.fill();
        ctx.strokeStyle = brown ? 'rgba(90,45,10,0.9)' : P.glass; ctx.lineWidth = 2; rr(ctx, bx, by, bw, bh, rad); ctx.stroke();
        // Hals
        ctx.fillStyle = brown ? 'rgba(110,58,18,0.85)' : rgba(tint, 0.25);
        ctx.fillRect(x - B.neck / 2, by - B.neckH, B.neck, B.neckH + 2);
        ctx.strokeStyle = brown ? 'rgba(90,45,10,0.9)' : P.glass; ctx.lineWidth = 1.6; ctx.strokeRect(x - B.neck / 2, by - B.neckH, B.neck, B.neckH + 2);
        // Pipette in der Flasche (wenn nicht aufgenommen)
        const p = st.pip;
        if (!(p.key === key && p.tab === st.tab)) { const r = this.lab.restPos(key); this.drawPipetteAt(ctx, key, r.x, r.y, 0, false); }
      });
    }

    // ------------------------------------------------------------ Silberabfall und Ausgießen
    wastePos() {
      const tb = this.lab.tab(), W = G.WASTE;
      const x = G.wasteX(tb.visible, this.view.worldW);
      return { x, top: G.BENCH - W.h, w: W.w, h: W.h };
    }
    /** Sammelbehälter für Silberabfälle auf dem Tisch (Becherglas mit Ausguss); Inhalt aus dem Modell. */
    drawWaste(ctx) {
      const P = this.P, w = this.wastePos(), tb = this.lab.tab(), ws = tb.waste || { V: 0, solid: 0 };
      const x0 = w.x - w.w / 2, x1 = w.x + w.w / 2, y0 = w.top, y1 = G.BENCH - 2;
      ctx.fillStyle = P.shadow; ctx.beginPath(); ctx.ellipse(w.x, G.BENCH + 2, w.w / 2 + 6, 6, 0, 0, Math.PI * 2); ctx.fill();
      const path = () => { ctx.beginPath(); ctx.moveTo(x0 - 8, y0 - 6); ctx.lineTo(x0, y0 + 8); ctx.lineTo(x0, y1 - 10); ctx.quadraticCurveTo(x0, y1, x0 + 10, y1); ctx.lineTo(x1 - 10, y1); ctx.quadraticCurveTo(x1, y1, x1, y1 - 10); ctx.lineTo(x1, y0); };
      path(); ctx.fillStyle = 'rgba(170,205,245,0.10)'; ctx.fill();
      if (ws.V > 0.001) {
        const f = Math.min(0.82, 0.06 + ws.V / 90), ly = y1 - (y1 - y0 - 10) * f;
        const turb = ws.solid > 0 ? clamp(0.25 + ws.solid * 400, 0.25, 0.75) : 0;
        ctx.fillStyle = rgba(P.liquid, 0.30); ctx.fillRect(x0 + 2, ly, w.w - 4, y1 - ly - 1);
        if (turb) { ctx.fillStyle = rgba([226, 224, 214], turb * 0.7); ctx.fillRect(x0 + 2, ly + 4, w.w - 4, y1 - ly - 5); }
        ctx.strokeStyle = this.theme === 'dark' ? 'rgba(255,255,255,0.5)' : 'rgba(40,80,120,0.45)'; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(x0 + 2, ly); ctx.lineTo(x1 - 2, ly); ctx.stroke();
      }
      path(); ctx.strokeStyle = P.glass; ctx.lineWidth = 2.2; ctx.stroke();
      ctx.strokeStyle = P.rim; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x0 - 8, y0 - 6); ctx.lineTo(x0 + 4, y0 - 2); ctx.moveTo(x1 - 4, y0); ctx.lineTo(x1 + 2, y0); ctx.stroke();
    }
    /**
     * Lage des ausgegossenen Glases: Anheben, zum Behälter führen und kippen, ausgießen, aufrichten,
     * zurückstellen (beim Entfernen: am Behälter ausblenden). Zeitachse wie im Modell (st.pour).
     */
    pourPose(pr) {
      const k = clamp(pr.t / pr.dur, 0, 1), R = G.TUBE_R + G.WALL;
      const x0 = this.lab.tubePos(pr.slot), w = this.wastePos();
      const TH = 112 * Math.PI / 180, c = Math.cos(TH), sn = Math.sin(TH);
      const lift = G.RIM_Y - 120;
      // Lippe (rechte Randecke nach dem Kippen) über der Öffnung des Behälters
      const lipX = w.x - 8, lipY = w.top - 110;
      const px = lipX - R * c, py = lipY - R * sn;
      const ease = (u) => (u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2);
      let x = x0, y = G.RIM_Y, a = 0, alpha = 1, phase = 'lift';
      if (k < 0.1) { y = lerp(G.RIM_Y, lift, ease(k / 0.1)); }
      else if (k < 0.26) { const u = ease((k - 0.1) / 0.16); x = lerp(x0, px, u); y = lerp(lift, py, u); a = TH * u; phase = 'tilt'; }
      else if (k < 0.72) { x = px; y = py; a = TH; phase = 'pour'; }
      else if (pr.remove) { const u = (k - 0.72) / 0.28; x = px; y = py; a = TH * (1 - 0.25 * ease(u)); alpha = 1 - ease(clamp(u / 0.8, 0, 1)); phase = 'fade'; }
      else if (k < 0.84) { const u = ease((k - 0.72) / 0.12); x = lerp(px, x0, u); y = lerp(py, lift, u); a = TH * (1 - u); phase = 'back'; }
      else { y = lerp(lift, G.RIM_Y, ease((k - 0.84) / 0.16)); phase = 'down'; }
      return { k, x, y, a, alpha, phase, x0, lip: { x: x + R * Math.cos(a), y: y + R * Math.sin(a) }, w };
    }
    /** Innenraum des Glases als Polygon (Weltkoordinaten bei aufrechtem Glas an Stelle x). */
    cavity(x) {
      const R = G.TUBE_R, B = G.INNER_BOTTOM, pts = [[x - R, G.RIM_Y], [x - R, B - R]];
      for (let i = 1; i < 18; i++) { const an = Math.PI - (i / 18) * Math.PI; pts.push([x + R * Math.cos(an), B - R + R * Math.sin(an)]); }
      pts.push([x + R, B - R], [x + R, G.RIM_Y]);
      return pts;
    }
    drawPour(ctx) {
      const st = this.lab.state, pr = st.pour, tb = this.lab.tab(), t = tb.tubes[pr.slot], P = this.P;
      if (!t) return;
      const q = this.pourPose(pr), R = G.TUBE_R;
      const ca = Math.cos(q.a), sa = Math.sin(q.a);
      const tf = (p) => [q.x + (p[0] - q.x0) * ca - (p[1] - G.RIM_Y) * sa, q.y + (p[0] - q.x0) * sa + (p[1] - G.RIM_Y) * ca];
      ctx.save(); ctx.globalAlpha = q.alpha;
      // Flüssigkeit: gleiche Querschnittsfläche wie im aufrechten Glas, Oberfläche waagrecht
      if (t.V > 0.005) {
        const up = this.cavity(q.x0), A0 = polyArea(clipBelow(up, G.surfaceY(t.V)));
        const poly = up.map(tf);
        let lo = Math.min(...poly.map((p) => p[1])), hi = Math.max(...poly.map((p) => p[1]));
        for (let i = 0; i < 40; i++) { const m = (lo + hi) / 2; if (polyArea(clipBelow(poly, m)) > A0) lo = m; else hi = m; }
        const liq = clipBelow(poly, (lo + hi) / 2);
        if (liq.length > 2) {
          ctx.beginPath(); liq.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]))); ctx.closePath();
          ctx.fillStyle = rgba(P.liquid, Math.max(0.3, P.liquidA * 2)); ctx.fill();
          const pig = this.pigment(t), op = t.susp > 0 ? M.turbidity(t.susp / Math.max(0.05, t.V) * 1e6) : 0;
          if (op > 0) { ctx.fillStyle = rgba(pig, op); ctx.fill(); }
        }
      }
      // Glas
      ctx.save();
      ctx.translate(q.x, q.y); ctx.rotate(q.a); ctx.translate(-q.x0, -G.RIM_Y);
      this.tubePath(ctx, q.x0, 0); ctx.strokeStyle = P.glass; ctx.lineWidth = 1.8; ctx.stroke();
      this.tubePath(ctx, q.x0, G.WALL); ctx.strokeStyle = P.glassIn; ctx.lineWidth = 1; ctx.stroke();
      ctx.strokeStyle = P.rim; ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.ellipse(q.x0, G.RIM_Y, R + G.WALL + 3, 4, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.22)'; ctx.fillRect(q.x0 - R + 7, G.RIM_Y + 14, 4, G.INNER_BOTTOM - G.RIM_Y - 50);
      ctx.restore();
      // Strahl von der Lippe in die Öffnung des Behälters, solange das Modell ausgießt
      if (q.phase === 'pour' && t.V > 0.005 && q.k > 0.25 && q.k < 0.7) {
        const y1 = q.w.top + 30, x1 = q.w.x - 4;
        const pig = this.pigment(t), op = t.susp > 0 ? M.turbidity(t.susp / Math.max(0.05, t.V) * 1e6) : 0;
        const wdt = 3 + 3 * Math.min(1, t.V / 4);
        ctx.fillStyle = op > 0.05 ? rgba(pig, 0.5 + op * 0.4) : P.stream;
        ctx.beginPath(); ctx.moveTo(q.lip.x - wdt, q.lip.y); ctx.lineTo(q.lip.x + wdt * 0.6, q.lip.y);
        ctx.quadraticCurveTo(x1 + wdt * 0.4, q.lip.y + 20, x1 + wdt * 0.4, y1); ctx.lineTo(x1 - wdt * 0.4, y1);
        ctx.quadraticCurveTo(x1 - wdt * 0.4, q.lip.y + 24, q.lip.x - wdt, q.lip.y); ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    }
    pigment(t) {
      return t.model === 'water' ? (C.WATER[C.SOLUTIONS[t.sample] && C.SOLUTIONS[t.sample].water] || {}).pigment || [236, 234, 226] : C.PIGMENT[t.halide] || [240, 240, 240];
    }

    /** Pipette mit Spitze bei (x, y): Glasschaft und Gummihütchen. */
    drawPipetteAt(ctx, key, x, y, squeeze, filled, alpha) {
      const P = this.P;
      ctx.save();
      if (alpha != null) ctx.globalAlpha = alpha;
      const len = G.PIPETTE_LEN, w = 9;
      // Schaft
      ctx.fillStyle = 'rgba(230,240,250,0.30)';
      ctx.beginPath(); ctx.moveTo(x - 2, y); ctx.lineTo(x - w / 2, y - 26); ctx.lineTo(x - w / 2, y - len); ctx.lineTo(x + w / 2, y - len); ctx.lineTo(x + w / 2, y - 26); ctx.lineTo(x + 2, y); ctx.closePath(); ctx.fill();
      if (filled) {
        ctx.fillStyle = key === 'agno3' ? 'rgba(220,225,230,0.75)' : rgba(P.liquid, 0.65);
        ctx.beginPath(); ctx.moveTo(x - 1.6, y - 2); ctx.lineTo(x - w / 2 + 1.5, y - 26); ctx.lineTo(x - w / 2 + 1.5, y - 70); ctx.lineTo(x + w / 2 - 1.5, y - 70); ctx.lineTo(x + w / 2 - 1.5, y - 26); ctx.lineTo(x + 1.6, y - 2); ctx.closePath(); ctx.fill();
      }
      ctx.strokeStyle = P.glass; ctx.lineWidth = 1.3;
      ctx.beginPath(); ctx.moveTo(x - 2, y); ctx.lineTo(x - w / 2, y - 26); ctx.lineTo(x - w / 2, y - len); ctx.moveTo(x + 2, y); ctx.lineTo(x + w / 2, y - 26); ctx.lineTo(x + w / 2, y - len); ctx.stroke();
      // Hütchen
      const sq = 1 - 0.18 * (squeeze || 0);
      ctx.fillStyle = BULB[key] || '#555';
      ctx.beginPath(); ctx.ellipse(x, y - len - 16, 11 * sq, 20, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillRect(x - 8, y - len - 6, 16, 10);
      ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.beginPath(); ctx.ellipse(x - 4, y - len - 22, 3, 8, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    drawPipette(ctx) {
      const p = this.lab.state.pip, st = this.lab.state;
      if (!p.key || p.tab !== st.tab) return;
      this.drawPipetteAt(ctx, p.key, p.x, p.y, p.squeeze, true);
      if (this.ghost) this.drawPipetteAt(ctx, p.key, this.ghost.x, this.ghost.y + 60, 0, true, 0.45);
      // Ziel über dem Glas: dezente Markierung der Spitze
      if (p.phase === 'over') {
        ctx.strokeStyle = `rgba(${this.P.sel},0.6)`; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(p.x, p.y + 4, 9, 0, Math.PI * 2); ctx.stroke();
      }
    }

    drawDrops(ctx) {
      const st = this.lab.state, P = this.P;
      const streaming = new Map();
      for (const d of st.drops) {
        if (d.tab !== st.tab) continue;
        if (d.stream) { const s = streaming.get(d.slot) || { x: d.x, top: Infinity, bottom: -Infinity }; s.top = Math.min(s.top, d.y); s.bottom = Math.max(s.bottom, d.y); streaming.set(d.slot, s); continue; }
        const r = 7, speed = G.GRAV * d.t;
        this.drawDrop(ctx, d.x, d.y, r, 1 + Math.min(0.45, speed / 3000), d.key);
      }
      // Strahl: zusammenhängend von der Spitze bis zum vordersten Anteil
      for (const [slot, s] of streaming) {
        const t = this.lab.tube(slot);
        const y0 = G.pipetteOver(this.lab.tubePos(slot)).y + 8;
        const y1 = Math.min(s.bottom, G.surfaceY(t.V));
        const g = ctx.createLinearGradient(s.x - 3, 0, s.x + 3, 0);
        g.addColorStop(0, 'rgba(150,195,245,0.25)'); g.addColorStop(0.5, P.stream); g.addColorStop(1, 'rgba(150,195,245,0.25)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.moveTo(s.x - 1.6, y0); ctx.lineTo(s.x + 1.6, y0); ctx.lineTo(s.x + 2.6, y1); ctx.lineTo(s.x - 2.6, y1); ctx.closePath(); ctx.fill();
      }
    }
    drawDrop(ctx, x, y, r, stretch, key) {
      ctx.save(); ctx.translate(x, y); ctx.scale(1, stretch || 1);
      const g = ctx.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r);
      g.addColorStop(0, 'rgba(255,255,255,0.9)');
      g.addColorStop(0.35, key === 'agno3' ? 'rgba(225,230,236,0.45)' : 'rgba(200,228,255,0.35)');
      g.addColorStop(1, 'rgba(120,170,230,0.55)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = this.P.drop; ctx.lineWidth = 0.7; ctx.stroke();
      ctx.restore();
    }

    // ------------------------------------------------------------ Reagenzglasständer
    drawRack(ctx, front) {
      const tb = this.lab.tab(), P = this.P, Ww = this.view.worldW;
      const x0 = G.tubeX(0, tb.visible, Ww) - G.TUBE_GAP / 2 + 10, x1 = G.tubeX(tb.visible - 1, tb.visible, Ww) + G.TUBE_GAP / 2 - 10;
      const plateY = G.INNER_BOTTOM - 300;
      if (!front) {
        ctx.fillStyle = P.rack;
        ctx.fillRect(x0, plateY, 10, G.BENCH - plateY); ctx.fillRect(x1 - 10, plateY, 10, G.BENCH - plateY);
        ctx.fillRect(x0, G.BENCH - 16, x1 - x0, 14);
        return;
      }
      ctx.fillStyle = P.rackFront; rr(ctx, x0 - 6, plateY - 7, x1 - x0 + 12, 14, 4); ctx.fill();
      ctx.strokeStyle = P.rack; ctx.lineWidth = 1.2; ctx.stroke();
    }

    // ------------------------------------------------------------ Reagenzglas
    tubePath(ctx, x, inset) {
      const r = G.TUBE_R + G.WALL - inset; // inset 0 = Außenwand, WALL = Innenwand
      const bottom = G.INNER_BOTTOM + G.WALL - inset;
      const top = G.RIM_Y;
      ctx.beginPath();
      ctx.moveTo(x - r, top);
      ctx.lineTo(x - r, bottom - r);
      ctx.arc(x, bottom - r, r, Math.PI, 0, true);
      ctx.lineTo(x + r, top);
    }
    liquidPath(ctx, x, surf, f) {
      const R = G.TUBE_R, h = f.h;
      ctx.beginPath();
      // Meniskus: an der Glaswand leicht hochgezogen (benetzendes Wasser)
      const men = Math.min(5, Math.max(0, (G.INNER_BOTTOM - surf) * 0.25));
      ctx.moveTo(x - R - 4, surf - men);
      for (let i = 0; i < WAVE_N; i++) {
        const u = i / (WAVE_N - 1), px = x - R + u * 2 * R;
        const edge = Math.pow(Math.abs(u - 0.5) * 2, 6) * men;
        ctx.lineTo(px, surf + h[i] - edge);

    drawTube(ctx, t, slot, selected) {
      const P = this.P, x = this.lab.tubePos(slot), f = this.tubeFx(this.lab.state.tab, slot);
      const R = G.TUBE_R;
      ctx.save();
      // Schwenken: Pendelbewegung um die Halterung im Ständer
      if (t.shake > 0 && !this.reduceMotion) {
        const ph = (M.T.shake - t.shake) / M.T.shake;
        const ang = Math.sin(ph * Math.PI * 5) * 0.11 * Math.sin(ph * Math.PI);
        const piv = G.INNER_BOTTOM - 300;
        ctx.translate(x, piv); ctx.rotate(ang); ctx.translate(-x, -piv);
      }
      // Auswahl
      if (selected) {
        ctx.strokeStyle = `rgba(${P.sel},0.85)`; ctx.lineWidth = 3; ctx.setLineDash([8, 6]);
        this.tubePath(ctx, x, -10); ctx.stroke(); ctx.setLineDash([]);
      }
      // Rückwand
      this.tubePath(ctx, x, 0); ctx.closePath();
      const back = ctx.createLinearGradient(x - R, 0, x + R, 0);
      back.addColorStop(0, 'rgba(170,205,245,0.12)'); back.addColorStop(0.5, 'rgba(255,255,255,0.03)'); back.addColorStop(1, 'rgba(170,205,245,0.10)');
      ctx.fillStyle = back; ctx.fill();

      if (t.V > 0) {
        const surf = G.surfaceY(t.V);
        ctx.save();
        this.tubePath(ctx, x, G.WALL); ctx.closePath(); ctx.clip();
        this.liquidPath(ctx, x, surf, f); ctx.clip();
        // klare Flüssigkeit
        ctx.fillStyle = rgba(P.liquid, P.liquidA);
        ctx.fillRect(x - R - 5, surf - 10, 2 * R + 10, G.INNER_BOTTOM - surf + 20);
        this.drawSolid(ctx, t, x, surf, f);
        // seitliche Abdunkelung (Volumenwirkung)
        const side = ctx.createLinearGradient(x - R, 0, x + R, 0);
        side.addColorStop(0, 'rgba(10,20,35,0.22)'); side.addColorStop(0.28, 'rgba(10,20,35,0)'); side.addColorStop(0.72, 'rgba(10,20,35,0)'); side.addColorStop(1, 'rgba(10,20,35,0.24)');
        ctx.fillStyle = side; ctx.fillRect(x - R - 5, surf - 10, 2 * R + 10, G.INNER_BOTTOM - surf + 20);
        ctx.restore();
        // Oberfläche (2,5D-Ellipse) und Kante
        ctx.save();
        this.tubePath(ctx, x, G.WALL); ctx.closePath(); ctx.clip();
        const hw = G.halfWidthAt(surf);
        ctx.fillStyle = 'rgba(255,255,255,0.10)';
        ctx.beginPath(); ctx.ellipse(x, surf, hw, Math.min(6, hw * 0.12), 0, 0, Math.PI * 2); ctx.fill();
        this.liquidPath(ctx, x, surf, f);
        ctx.strokeStyle = this.theme === 'dark' ? 'rgba(255,255,255,0.55)' : 'rgba(40,80,120,0.45)'; ctx.lineWidth = 1.3; ctx.stroke();
        for (const r of f.rings) {
          const k = r.age / r.life, rx = 3 + k * hw * 0.9;
          ctx.strokeStyle = `rgba(255,255,255,${(0.45 * (1 - k)).toFixed(3)})`; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.ellipse(r.x, surf, rx, rx * 0.12 + 0.8, 0, 0, Math.PI * 2); ctx.stroke();
        }
        ctx.restore();
      }
      // vorderes Glas: Konturen, Rand, Glanz
      this.tubePath(ctx, x, 0); ctx.strokeStyle = P.glass; ctx.lineWidth = 1.8; ctx.stroke();
      this.tubePath(ctx, x, G.WALL); ctx.strokeStyle = P.glassIn; ctx.lineWidth = 1; ctx.stroke();
      ctx.strokeStyle = P.rim; ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.ellipse(x, G.RIM_Y, R + G.WALL + 3, 4, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.save(); ctx.globalAlpha = P.hl;
      const hl = ctx.createLinearGradient(0, G.RIM_Y, 0, G.INNER_BOTTOM);
      hl.addColorStop(0, 'rgba(255,255,255,0)'); hl.addColorStop(0.2, 'rgba(255,255,255,0.32)'); hl.addColorStop(0.85, 'rgba(255,255,255,0.16)'); hl.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = hl; ctx.fillRect(x - R + 7, G.RIM_Y + 14, 4, G.INNER_BOTTOM - G.RIM_Y - 50);
      ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(x + R - 10, G.RIM_Y + 30, 2.5, G.INNER_BOTTOM - G.RIM_Y - 90);
      ctx.restore();
      ctx.restore();
    }

    /** Niederschlag: Bodensatz, Schwebe mit Absetzfront, Wolken – alles aus dem Modellzustand. */
    drawSolid(ctx, t, x, surf, f) {
      const pig = this.pigment(t);
      const P = this.P, R = G.TUBE_R, dark = this.theme === 'dark';
      const total = M.solidTotal(t);
      if (!(total > 0)) return;
      // Bodensatz
      let sedTop = G.INNER_BOTTOM;
      if (t.sed > 0) {
        const vs = Math.min(t.V * 0.9, t.sed * 1000 * G.SEDIMENT_ML_PER_MMOL);
        sedTop = G.surfaceY(vs);
        const g = ctx.createLinearGradient(0, sedTop - 4, 0, G.INNER_BOTTOM);
        g.addColorStop(0, rgba(pig, 0.0)); g.addColorStop(0.18, rgba(pig, 0.85)); g.addColorStop(1, rgba(shade(pig, 0.86), 0.97));
        ctx.fillStyle = g; ctx.fillRect(x - R - 2, sedTop - 4, 2 * R + 4, G.INNER_BOTTOM - sedTop + 12);
        // körnige Struktur, auf hellem Grund mit dunkleren Punkten erkennbar
        if (!dark) { ctx.strokeStyle = rgba(shade(pig, 0.62), 0.55); ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(x - G.halfWidthAt(sedTop + 2), sedTop + 2); ctx.lineTo(x + G.halfWidthAt(sedTop + 2), sedTop + 2); ctx.stroke(); }
        ctx.fillStyle = rgba(dark ? shade(pig, 0.75) : P.speck, dark ? 0.35 : 0.18);
        for (const s of f.specks) { const yy = lerp(sedTop + 3, G.INNER_BOTTOM - 2, s.v); if (Math.abs(s.u - 0.5) * 2 * R < G.halfWidthAt(yy) - 2) ctx.fillRect(x + (s.u - 0.5) * 2 * R, yy, 1.6, 1.6); }
      }
      // Schwebe: Konzentration unter der Front gleichmäßig, Front als weiche Kante
      if (t.susp > 0) {
        const vReg = Math.max(0.05, t.V * (1 - t.front));
        const op = M.turbidity(t.susp / vReg * 1e6);
        const yF = lerp(surf, sedTop, t.front);
        const g = ctx.createLinearGradient(0, yF - 10, 0, sedTop);
        g.addColorStop(0, rgba(pig, 0)); g.addColorStop(Math.min(0.5, 18 / Math.max(20, sedTop - yF + 10)), rgba(pig, op)); g.addColorStop(1, rgba(pig, Math.min(0.9, op * 1.08)));
        ctx.fillStyle = g; ctx.fillRect(x - R - 2, yF - 10, 2 * R + 4, sedTop - yF + 12);
        // Flocken: sichtbare Struktur, bewegt sich beim Absetzen mit
        const n = Math.round(f.specks.length * clamp(op * 1.2, 0, 1));
        ctx.fillStyle = rgba(dark ? [255, 255, 255] : P.speck, dark ? 0.22 : 0.16);
        const drift = this.reduceMotion ? 0 : this.time;
        for (let i = 0; i < n; i++) {
          const s = f.specks[i];
          const yy = lerp(yF + 4, sedTop - 2, (((s.v + 0.03 * Math.sin(drift * s.w + s.p)) % 1) + 1) % 1);
          const xx = x + (s.u - 0.5) * 2 * (G.halfWidthAt(yy) - 3) + Math.sin(drift * 0.7 + s.p) * 2;
          ctx.fillRect(xx, yy, 1.8, 1.8);
        }
      }
      // Wolken: entstehen am Eintreffpunkt, sinken, breiten sich aus
      for (const c of t.clouds) {
        const k = clamp(c.age / M.T.cloud, 0, 1);
        const depth = Math.max(10, sedTop - surf);
        const cx = x + c.x * R * (1 - k * 0.6);
        const cy = surf + 5 + depth * (this.reduceMotion ? 0.3 : 0.62) * Math.sqrt(k);
        const rad = 7 + (R * 0.95 - 7) * Math.sqrt(k);
        const share = clamp(0.04 + 0.9 * k, 0.04, 0.95);
        const op = clamp(M.turbidity(c.m / Math.max(0.02, t.V * share) * 1e6) * (1.05 - 0.15 * k), 0, 0.9);
        for (let j = 0; j < 3; j++) {
          const ox = (j - 1) * rad * 0.45 * (0.6 + 0.4 * k), oy = (j === 1 ? -0.2 : 0.25) * rad;
          const g = ctx.createRadialGradient(cx + ox, cy + oy, 0, cx + ox, cy + oy, rad * (j === 1 ? 1 : 0.75));
          g.addColorStop(0, rgba(pig, op)); g.addColorStop(0.55, rgba(pig, op * 0.55)); g.addColorStop(1, rgba(pig, 0));
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.ellipse(cx + ox, cy + oy, rad * (j === 1 ? 1 : 0.75), rad * 0.8 * (j === 1 ? 1 : 0.75), 0, 0, Math.PI * 2); ctx.fill();
        }
      }
    }
  }

  /** Teil des Polygons unterhalb der Waagrechten y = lv (Weltkoordinaten: größeres y = tiefer). */
  function clipBelow(poly, lv) {
    const out = [];
    for (let i = 0; i < poly.length; i++) {
      const a = poly[i], b = poly[(i + 1) % poly.length], ina = a[1] >= lv, inb = b[1] >= lv;
      if (ina) out.push(a);
      if (ina !== inb) { const u = (lv - a[1]) / (b[1] - a[1]); out.push([a[0] + (b[0] - a[0]) * u, lv]); }
    }
    return out;
  }
  function polyArea(p) { let s = 0; for (let i = 0; i < p.length; i++) { const a = p[i], b = p[(i + 1) % p.length]; s += a[0] * b[1] - b[0] * a[1]; } return Math.abs(s) / 2; }
  /**
   * Flaschenetikett (HTML, app.js): Formel groß, Name, Zusatz (verdünnt/konzentriert/destilliert).
   * Keine Konzentrationsangaben auf der Bühne – die stehen in der Infokarte.
   */
  const SH = '\u00ad';
  function bottleText(key) {
    return {
      nacl: { f: 'NaCl', n: 'Natrium' + SH + 'chlorid' }, nabr: { f: 'NaBr', n: 'Natrium' + SH + 'bromid' }, nai: { f: 'NaI', n: 'Natrium' + SH + 'iodid' },
      agno3: { f: 'AgNO₃', n: 'Silber' + SH + 'nitrat' }, nh3dil: { f: 'NH₃', n: 'Ammoniak', q: 'verdünnt' }, nh3conc: { f: 'NH₃', n: 'Ammoniak', q: 'konzen' + SH + 'triert' },
      water: { f: 'H₂O', n: 'Wasser', q: 'destilliert' }, tap: { f: '', n: 'Leitungs' + SH + 'wasser', q: 'Probe' }, mineral: { f: '', n: 'Mineral' + SH + 'wasser', q: 'Probe' }
    }[key] || { f: key, n: '' };
  }
  /** Kurzbezeichnung (Bedienleiste, Protokoll). */
  function shortText(key) {
    return { agno3: 'AgNO₃', nacl: 'NaCl', nabr: 'NaBr', nai: 'NaI', nh3dil: 'NH₃ verdünnt', nh3conc: 'NH₃ konzentriert', water: 'H₂O dest.', tap: 'Leitungswasser', mineral: 'Mineralwasser' }[key] || key;
  }
  function shade(c, k) { return [c[0] * k, c[1] * k, c[2] * k]; }
  function makeSpecks(seed) {
    let s = seed * 9301 + 49297;
    const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
    return Array.from({ length: 70 }, () => ({ u: rnd(), v: rnd(), w: 0.4 + rnd(), p: rnd() * 6.28 }));
  }

  (root.FL = root.FL || {}).LabRenderer = LabRenderer;
  root.FL.render = { STRIP, PAL, BULB, bottleText, shortText, clipBelow, polyArea };
})(typeof self !== 'undefined' ? self : this);

</script>
  <script data-src="js/ui.js">
/*
 * Fällungslabor – Bedienfeld: Anleitung, Beobachtung (Protokoll + Ergebnisübersicht), Aufgaben
 * bzw. Auswertung, Hefteintrag bzw. Kurzfassung; dazu Dialoge (Gefahrstoffkarte, Hefteintrag,
 * Gesamtrücksetzen). Aufbau, Schaltflächen und Rückmeldeformen nach Redoxlabor/Labkit
 * (docs/QUALITY.md). Liest den Laborzustand nur; Antworten bleiben lokal.
 */
(function (root) {
  'use strict';
  const FL = root.FL, C = FL.chem, M = FL.model, T = FL.tasks, GHS = FL.ghs, LL = root.LK.learn, core = root.LK.core;
  const esc = LL.esc;
  const md = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  const fmt = (v, d) => C.fmt(v, d);
  const PTABS = {
    main: [['guide', 'Anleitung'], ['obs', 'Protokoll'], ['tasks', 'Aufgaben'], ['note', 'Hefteintrag']],
    control: [['guide', 'Anleitung'], ['obs', 'Protokoll'], ['tasks', 'Auswertung'], ['note', 'Kurzfassung']]
  };
  const STEPS = { main: T.STEPS, control: T.CONTROL_STEPS };

  /** Startwert für das Mischen: neu je Durchgang; über „#seed=…“ in der Adresse festlegbar (Prüfungen). */
  function hashSeed(offset) {
    try { const m = /[#&]seed=(\d+)/.exec(root.location.hash || ''); if (m) return (Number(m[1]) + (offset || 0)) >>> 0; } catch (e) { /* ohne Adresse */ }
    return null;
  }
  function freshLearn(p) {
    const steps = STEPS[p];
    const fixed = hashSeed(p === 'main' ? 0 : 1);
    return { v: 2, seed: fixed != null ? fixed : T.newSeed(), step: steps[0].id, steps: LL.freshState(steps) };
  }
  function freshState() {
    return {
      ptab: { main: 'guide', control: 'guide' },
      learn: { main: freshLearn('main'), control: freshLearn('control') },
      records: { main: [], control: [] }, drafts: {}, uid: 1
    };
  }
  function sanitize(s) {
    const f = freshState();
    if (!s || typeof s !== 'object') return f;
    for (const p of ['main', 'control']) {
      if (s.ptab && PTABS[p].some(([k]) => k === s.ptab[p])) f.ptab[p] = s.ptab[p];
      const L = s.learn && s.learn[p];
      // Antworten aus 1.0.0 (Buchstaben) werden auf die fachlichen IDs abgebildet und neu bewertet
      const legacy = L && L.v !== 2;
      if (L && L.steps) for (const st of STEPS[p]) if (L.steps[st.id]) {
        const ss = Object.assign(LL.freshStep(), L.steps[st.id], { confirmSolution: false });
        if (legacy) {
          const m = T.migrateAnswers(ss.answers);
          ss.answers = m.answers;
          if (ss.graded) ss.graded = T.grade(st, ss.answers);
          if (m.changed) f.migrated = true;
        }
        f.learn[p].steps[st.id] = ss;
      }
      if (L && STEPS[p].some((x) => x.id === L.step)) f.learn[p].step = L.step;
      if (L && L.v === 2 && Number.isInteger(L.seed) && L.seed >= 0) f.learn[p].seed = L.seed >>> 0;
      if (s.records && Array.isArray(s.records[p])) f.records[p] = s.records[p].filter((r) => r && r.ansatz);
    }
    if (s.drafts && typeof s.drafts === 'object') f.drafts = s.drafts;
    f.uid = s.uid | 0 || 1;
    return f;
  }

  /** Kurzbeschreibung der Zugaben eines Ansatzes (tatsächliche Volumina). */
  function addsText(t) {
    if (!t || !(t.V > 0)) return 'leer';
    const s = C.SOLUTIONS[t.sample];
    const parts = [`${s ? s.short || s.name : 'Probe'} ${fmt(t.log.sampleV, 2)} mL`];
    if (t.log.agDrops) parts.push(`AgNO₃ ${t.log.agDrops} Tr. (${fmt(t.log.agV, 2)} mL)`);
    if (t.log.waterV) parts.push(`Wasser ${fmt(t.log.waterV, 2)} mL`);
    if (t.log.nh3dilV) parts.push(`NH₃ verd. ${fmt(t.log.nh3dilV, 2)} mL`);
    if (t.log.nh3concV) parts.push(`NH₃ konz. ${fmt(t.log.nh3concV, 2)} mL`);
    return parts.join(' · ');
  }

  function create(opts) {
    const { lab } = opts;
    const S = sanitize(opts.saved);
    const body = document.getElementById('panelBody');
    const tabsEl = document.getElementById('ptabs');
    const modal = document.getElementById('modal'), modalBody = document.getElementById('modalBody');
    const part = () => lab.state.tab;
    let lastSig = '', lastView = '';
    let lastFocusBeforeModal = null;

    // ---------------------------------------------------------------- Reiter des Bedienfelds
    function renderTabs() {
      const p = part();
      tabsEl.innerHTML = PTABS[p].map(([k, label]) => `<button type="button" role="tab" id="ptab-${k}" data-ptab="${k}" aria-selected="${S.ptab[p] === k}" aria-controls="panelBody">${label}</button>`).join('');
      body.setAttribute('aria-labelledby', 'ptab-' + S.ptab[p]);
    }
    tabsEl.addEventListener('click', (e) => {
      const b = e.target.closest('[data-ptab]');
