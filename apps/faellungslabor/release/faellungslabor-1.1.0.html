    });
    function showTab(k) { S.ptab[part()] = k; render(); }

    // ---------------------------------------------------------------- Inhalte
    function guideHtml(p) {
      if (p === 'main') {
        return `<div class="lk-card"><h2>Fällungsreaktionen</h2>
          <p>Untersuche, was passiert, wenn du Silbernitratlösung zu Natriumchlorid-, Natriumbromid- und Natriumiodidlösung gibst.</p>
          <ol class="steps-list">
            <li><b>Probe einfüllen:</b> Flasche antippen (Pipette aufnehmen), dann ein leeres Reagenzglas antippen. Die Pipette gibt das unten eingestellte Probevolumen ab.</li>
            <li><b>Silbernitratlösung zutropfen:</b> Flasche antippen, Reagenzglas antippen. Dann „Tropfen“ oder das Glas antippen = 1 Tropfen, gedrückt halten = mehrere Tropfen.</li>
            <li><b>Beobachten:</b> direkt nach dem Tropfen, nach dem Stehenlassen (Zeitraffer 5× hilft) und nach dem <b>Schwenken</b>. Vergleiche die drei Gläser nebeneinander.</li>
            <li><b>Notieren:</b> Glas antippen und im Reiter „Protokoll“ festhalten. Die Ergebnisübersicht steht darunter.</li>
          </ol></div>
          <div class="lk-card"><h3>Erweiterung: Ammoniakprüfung</h3>
          <p>Setze zwei Proben gleich an (gleiche Probe, gleiche Tropfenzahl) – mit „+ Glas“ stehen bis zu sechs Reagenzgläser bereit. Gib in das eine <b>verdünnte</b>, in das andere <b>konzentrierte</b> Ammoniaklösung (Dosierhilfe 0,5 mL / 1,0 mL) und schwenke. Zum Vergleich kannst du auch destilliertes Wasser zugeben.</p>
          <p class="lk-muted small">Ammoniaklösung gehört erst zu einem Ansatz, der schon Silbernitratlösung enthält.</p></div>
          <div class="lk-card"><h3>Gut zu wissen</h3>
          <ul class="small"><li>Ein Tropfen ist im Modell 0,050 mL. Jedes Reagenzglas fasst 20 mL.</li>
          <li><b>Spülen</b> gießt das gewählte Glas in den Behälter „Silberabfälle“ aus und beendet nur diesen Ansatz; er bleibt in der Ergebnisübersicht. <b>− Glas</b> nimmt ein Glas aus dem Ständer (gefüllt erst nach Rückfrage).</li>
          <li>Dieselbe Probe darfst du nachgeben, eine andere Probe nicht.</li>
          <li>Konzentrationen und Gefahrstoffhinweise: ⓘ unten auf dem Flaschenetikett antippen.</li>
          <li>Zeiten für Mischen und Absetzen sind für die Beobachtung gewählt, keine Messwerte.</li>
          <li>Hintergrund hell/dunkel ändert nur die Darstellung.</li></ul></div>
          ${resetHtml()}`;
      }
      return `<div class="lk-card"><h2>Kontrollversuche</h2>
        <p>Dieser Teil ist unabhängig vom Hauptversuch und kann davor oder danach bearbeitet werden.</p>
        <ul><li><b>Positivkontrolle:</b> Natriumchloridlösung + Silbernitratlösung – so sieht eine sichere Chloridfällung aus.</li>
        <li><b>Blindprobe (negativ):</b> destilliertes Wasser + Silbernitratlösung.</li>
        <li><b>Alltagsproben:</b> Leitungswasser und Mineralwasser + Silbernitratlösung.</li></ul>
        <p>Fülle jeweils das gleiche Probevolumen ein und gib überall gleich viele Tropfen Silbernitratlösung zu (z. B. mit „5 Tropfen“). Vergleiche dann alle vier Gläser.</p></div>
        <div class="lk-card"><h3>Hinweis zu den Wasserproben</h3><p class="small">Leitungs- und Mineralwasser sind hier feste Modellproben mit typischen Mengen gelöster Ionen. Echtes Wasser ist je nach Ort und Quelle verschieden zusammengesetzt und kann anders reagieren.</p></div>
        ${resetHtml()}`;
    }
    function resetHtml() {
      return `<div class="lk-card danger"><h3>Neu beginnen</h3><p class="small">Einzelne Gläser leerst du mit „Spülen“. Hier wird dagegen <b>alles</b> zurückgesetzt: beide Versuchsteile, Beobachtungen und Antworten.</p><button type="button" class="lk-btn" data-act="resetAll">Gesamten Lernstand zurücksetzen …</button></div>`;
    }

    function obsHtml(p) {
      const tb = lab.tab();
      const sel = tb.sel != null && tb.sel < tb.visible ? tb.sel : null;
      const t = sel != null ? tb.tubes[sel] : null;
      let card;
      if (!t) card = `<div class="lk-note info">Tippe ein Reagenzglas an, um eine Beobachtung festzuhalten.</div>`;
      else if (!(t.V > 0)) card = `<div class="lk-note info">Glas ${sel + 1} ist leer. Fülle zuerst eine Probe ein.</div>`;
      else {
        const d = S.drafts[t.ansatz + '@' + p] || {};
        const nh3 = t.log.nh3dilV > 0 || t.log.nh3concV > 0;
        const radios = (name, opts2) => Object.entries(opts2).map(([k, v]) => `<label class="lk-opt"><input type="radio" name="${name}" value="${k}"${d[name] === k ? ' checked' : ''}><span>${esc(v)}</span></label>`).join('');
        card = `<div class="lk-card"><h2>Glas ${sel + 1} · Ansatz ${esc(t.ansatz)}</h2>
          <p class="adds">${esc(addsText(t))}<br><span class="lk-muted">Volumen jetzt: ${fmt(t.V, 2)} mL</span></p>
          <form class="lk-form" id="obsForm" novalidate>
            <fieldset><legend>Trübung bzw. Niederschlag</legend>${radios('trueb', T.OBS.trueb)}</fieldset>
            <fieldset><legend>Farbe des Niederschlags</legend>${radios('farbe', T.OBS.farbe)}</fieldset>
            ${nh3 ? `<fieldset><legend>Nach Zugabe von Ammoniaklösung</legend>${radios('nh3', T.OBS.nh3)}</fieldset>` : ''}
            <label class="notefield">Eigene Notiz (freiwillig, wird nicht bewertet)<textarea name="note" rows="2" maxlength="300">${esc(d.note || '')}</textarea></label>
            <div class="lk-row"><button type="submit" class="lk-btn primary">Beobachtung speichern</button></div>
          </form></div>`;
      }
      return card + overviewHtml(p);
    }

    function recordStatus(r, p) {
      const tb = lab.tab(p);
      const cur = tb.tubes.slice(0, tb.visible).find((t) => t.ansatz === r.ansatz);
      if (!cur) return { cls: 'old', text: 'Ansatz beendet (Glas gespült).' };
      if (cur.rev !== r.rev) return { cls: 'changed', text: `Ansatz seither verändert (jetzt: ${addsText(cur)}). Die Notiz gehört zum früheren Stand.` };
      return { cls: 'cur', text: 'aktueller Stand' };
    }
    function overviewHtml(p) {
      const recs = S.records[p];
      const rows = recs.map((r) => {
        const s = recordStatus(r, p);
        const obs = [r.trueb && T.OBS.trueb[r.trueb], r.farbe && T.OBS.farbe[r.farbe], r.nh3 && ('nach NH₃: ' + T.OBS.nh3[r.nh3])].filter(Boolean).join(' · ') || '–';
        return `<li class="rec ${s.cls}"><div class="rec-h"><b>Ansatz ${esc(r.ansatz)}</b><span class="st">${s.cls === 'cur' ? '✓ ' : 'ⓘ '}${esc(s.text)}</span></div>
          <div><span class="lk-muted">Zugaben:</span> ${esc(r.adds)}</div><div><span class="lk-muted">Beobachtung:</span> ${esc(obs)}</div>${r.note ? `<div><span class="lk-muted">Notiz:</span> ${esc(r.note)}</div>` : ''}</li>`;
      }).join('');
      const intro = p === 'main' ? 'Deine gespeicherten Beobachtungen – mit den Zugaben zum Zeitpunkt der Notiz.' : 'Kontrollversuche (getrennt vom Hauptversuch ausgewertet).';
      return `<div class="lk-card"><h2>Ergebnisübersicht</h2><p class="small lk-muted">${intro}</p>${rows ? `<ul class="overview">${rows}</ul>` : '<p class="lk-muted">Noch keine Beobachtung gespeichert.</p>'}
        ${p === 'main' ? '<p class="small lk-muted">Grenze des Verfahrens: Zwei der Niederschläge sehen sich ähnlich – vergleiche sie nebeneinander und nutze die Ammoniakprobe.</p>' : ''}</div>`;
    }

    function tasksHtml(p) {
      const L = S.learn[p], steps = STEPS[p];
      const pr = T.progress(steps, L);
      let html = '';
      if (p === 'main') html += `<p class="progress" role="status">Pflichtschritte gelöst: <b>${pr.done} von ${pr.total}</b> · Schritt 4 (Ammoniak) ist eine Erweiterung.</p>`;
      // Anzeige mit der für diesen Durchgang gemischten Reihenfolge; Bewertung über dieselben IDs
      html += `<div class="tasks${p === 'main' && L.step === 'gleich' ? ' eqs' : ''}">${LL.taskHtml(steps.map((st) => T.view(st, L.seed)), L)}</div>`;
      const ss = L.steps[L.step];
      if (p === 'main' && L.step === 'nh3') html += `<details class="lk-card more"><summary>Vertiefung: Warum löst sich der Niederschlag?</summary><p>Ammoniakmoleküle binden gelöste Silberionen zum Diamminsilber(I)-Ion:</p><p class="eqline">Ag⁺(aq) + 2 NH₃(aq) → [Ag(NH₃)₂]⁺(aq)</p><p>Dadurch sinkt die Konzentration freier Silberionen, und Feststoff kann sich lösen. Je schwerer löslich der Niederschlag ist, desto mehr Ammoniak ist nötig – bei Silberiodid reicht auch konzentrierte Ammoniaklösung nicht.</p></details>`;
      if (p === 'control' && ss && ((ss.graded && ss.graded.allCorrect) || ss.solution)) html += `<div class="lk-card statement"><h3>Auswertung</h3><p>${esc(T.CONTROL_STATEMENT)}</p></div>`;
      html += `<div class="lk-row round"><button type="button" class="lk-btn small" data-act="newRound">Neuer Durchgang …</button><span class="small lk-muted">löscht die Antworten dieses Teils und mischt die Antworten neu</span></div>`;
      if (p === 'control') html += `<details class="lk-card more"><summary>Für Interessierte: andere Anionen und Ansäuern</summary><p>Neben Halogenidionen können auch andere Anionen, z. B. Carbonationen, mit Silberionen schwer lösliche Stoffe bilden. In der Analytik säuert man eine Probe deshalb vorher mit verdünnter Salpetersäure an: Carbonat wird dabei zerstört, Silberhalogenide bleiben bestehen. In diesem Labor wird nicht angesäuert.</p></details>`;
      return html;
    }

    function notebookHtml() {
      const nb = T.NOTEBOOK;
      return `<div class="lk-notebook" id="nbText"><p class="nb-tag">Zum Abschluss – für dein Heft</p><h2>${esc(nb.title)}</h2>${nb.blocks.map((b) => b.kind === 'eq' ? `<p class="eq"><span>${esc(b.text)}</span>, <span class="legend">${esc(b.legend)}</span></p>` : `<p>${md(b.text)}</p>`).join('')}</div>`;
    }
    function noteHtml(p) {
      if (p === 'main') return `${notebookHtml()}<div class="lk-row" style="margin-top:10px"><button type="button" class="lk-btn small" data-act="copyNb">Text kopieren</button><button type="button" class="lk-btn small" data-act="printNb">Drucken</button></div><p class="small lk-muted">Der Eintrag gilt unabhängig davon, ob dein eigener Versuch gelungen ist. Abschreibzeit etwa 5 Minuten.</p>`;
      const cs = T.CONTROL_SUMMARY;
      return `<div class="lk-notebook"><p class="nb-tag">Kurzfassung der Kontrollversuche</p><h2>${esc(cs.title)}</h2><p>${md(cs.text)}</p></div>`;
    }

    // ---------------------------------------------------------------- Zeichnen
    function render() {
      const p = part();
      const active = document.activeElement;
      const focusKey = active && body.contains(active) ? (active.name ? 'name:' + active.name + ':' + (active.value || '') : active.dataset && active.dataset.act ? 'act:' + active.dataset.act : active.dataset && active.dataset.step ? 'step:' + active.dataset.step : null) : null;
      const caret = active && typeof active.selectionStart === 'number' ? [active.selectionStart, active.selectionEnd] : null;
      renderTabs();
      const k = S.ptab[p];
      if (lastView !== p + ':' + k) { lastView = p + ':' + k; const panel = document.getElementById('panel'); if (panel) panel.scrollTop = 0; }
      body.innerHTML = k === 'guide' ? guideHtml(p) : k === 'obs' ? obsHtml(p) : k === 'tasks' ? tasksHtml(p) : noteHtml(p);
      lastSig = signature();
      if (focusKey) {
        let el = null;
        if (focusKey.startsWith('name:')) { const [, n, v] = focusKey.split(':'); el = body.querySelector(`[name="${n}"][value="${v}"]`) || body.querySelector(`[name="${n}"]`); }
        else if (focusKey.startsWith('act:')) el = body.querySelector(`[data-act="${focusKey.slice(4)}"]`);
        else if (focusKey.startsWith('step:')) el = body.querySelector(`[data-step="${focusKey.slice(5)}"]`);
        core.restoreFocus(el, caret);
      }
    }
    /** Neuaufbau nur, wenn sich für den sichtbaren Reiter Relevantes geändert hat. */
    function signature() {
      const p = part(), k = S.ptab[p], tb = lab.tab();
      if (k !== 'obs') return p + k;
      const t = tb.sel != null ? tb.tubes[tb.sel] : null;
      return [p, k, tb.sel, t && t.ansatz, t && t.rev, tb.tubes.map((x) => x.ansatz + ':' + x.rev).join(','), tb.visible, S.records[p].length].join('|');
    }
    function tick() {
      if (signature() !== lastSig) {
        // Eingaben im Protokoll nicht durch einen Neuaufbau verlieren
        const f = body.querySelector('#obsForm');
        if (f) storeDraft(f);
        render();
      }
    }

    // ---------------------------------------------------------------- Ereignisse
    function storeDraft(form) {
      const tb = lab.tab(), t = tb.sel != null ? tb.tubes[tb.sel] : null;
      if (!t || !t.ansatz) return;
      const d = LL.readForm(form);
      d.note = form.querySelector('textarea') ? form.querySelector('textarea').value : '';
      S.drafts[t.ansatz + '@' + part()] = d;
    }
    body.addEventListener('submit', (e) => {
      e.preventDefault();
      const p = part();
      if (e.target.id === 'obsForm') {
        const tb = lab.tab(), t = tb.tubes[tb.sel];
        if (!t || !t.ansatz) return;
        storeDraft(e.target);
        const d = S.drafts[t.ansatz + '@' + p] || {};
        if (!d.trueb && !d.farbe && !d.nh3 && !d.note) { opts.toast('Wähle mindestens eine Beobachtung aus.'); return; }
        S.records[p].push({ id: S.uid++, ansatz: t.ansatz, slot: tb.sel, rev: t.rev, sample: t.sample, adds: addsText(t), trueb: d.trueb || '', farbe: d.farbe || '', nh3: d.nh3 || '', note: (d.note || '').trim().slice(0, 300) });
        opts.toast(`Beobachtung zu Ansatz ${t.ansatz} gespeichert.`);
        render(); opts.save();
        return;
      }
      if (e.target.id === 'lkStepForm') {
        const L = S.learn[p], step = STEPS[p].find((s) => s.id === L.step), ss = L.steps[step.id];
        ss.answers = Object.assign({}, ss.answers, LL.readForm(e.target));
        ss.graded = T.grade(step, ss.answers);
        ss.confirmSolution = false;
        if (!ss.graded.allCorrect) ss.fails++;
        render(); opts.save();
        const note = body.querySelector('.lk-form .lk-note');
        if (note) try { note.scrollIntoView({ block: 'nearest' }); } catch (err) { /* ältere Browser */ }
      }
    });
    body.addEventListener('change', (e) => {
      const form = e.target.closest('form');
      if (!form) return;
      if (form.id === 'obsForm') { storeDraft(form); opts.save(); return; }
      if (form.id === 'lkStepForm') {
        const L = S.learn[part()], ss = L.steps[L.step];
        if (ss.solution) return;
        ss.answers = Object.assign({}, ss.answers, LL.readForm(form));
        opts.save();
      }
    });
    body.addEventListener('input', (e) => { if (e.target.name === 'note') { const f = e.target.closest('form'); if (f) storeDraft(f); } });
    body.addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      const p = part(), L = S.learn[p];
      if (b.dataset.step) { L.step = b.dataset.step; render(); opts.save(); return; }
      const act = b.dataset.act;
      if (!act) return;
      const step = STEPS[p].find((s) => s.id === L.step), ss = L.steps[step.id];
      if (act === 'tip') { ss.tip = Math.min(3, ss.tip + 1); render(); opts.save(); }
      else if (act === 'solution') {
        const form = body.querySelector('#lkStepForm');
        if (form && !ss.solution) ss.answers = Object.assign({}, ss.answers, LL.readForm(form));
        if (!(ss.graded && ss.graded.allCorrect) && !ss.confirmSolution) { ss.confirmSolution = true; render(); return; }
        ss.solution = true; ss.confirmSolution = false; render(); opts.save();
      } else if (act === 'solutionYes') { ss.solution = true; ss.confirmSolution = false; render(); opts.save(); }
      else if (act === 'solutionNo') { ss.confirmSolution = false; render(); }
      else if (act === 'hideSolution') { ss.solution = false; render(); opts.save(); }
      else if (act === 'resetAll') confirmReset();
      else if (act === 'newRound') openModal(`<h2 id="modalTitle">Neuer Durchgang?</h2><p>Alle Antworten im Teil „${p === 'main' ? 'Fällungsreaktionen' : 'Kontrollversuche'}“ werden gelöscht, die Antwortmöglichkeiten neu gemischt. Versuche und Beobachtungen bleiben erhalten.</p><div class="lk-row end"><button type="button" class="lk-btn" data-m="close">Abbrechen</button><button type="button" class="lk-btn primary" data-m="newRoundYes">Neu beginnen</button></div>`);
      else if (act === 'copyNb') copyNotebook();
      else if (act === 'printNb') printNotebook();
    });

    // ---------------------------------------------------------------- Dialoge
    function openModal(html, labelId) {
      lastFocusBeforeModal = document.activeElement;
      modalBody.innerHTML = html;
      modal.hidden = false;
      const card = modal.querySelector('.modal-card');
      card.setAttribute('aria-labelledby', labelId || 'modalTitle');
      const btn = modal.querySelector('[data-m="close"]') || card;
      try { btn.focus({ preventScroll: true }); } catch (e) { btn.focus(); }
    }
    function closeModal() {
      modal.hidden = true; modalBody.innerHTML = '';
      if (lastFocusBeforeModal && document.contains(lastFocusBeforeModal)) core.restoreFocus(lastFocusBeforeModal);
    }
    modal.addEventListener('click', (e) => {
      if (e.target === modal) { closeModal(); return; }
      const b = e.target.closest('[data-m]');
      if (!b) return;
      const m = b.dataset.m;
      if (m === 'close') closeModal();
      else if (m === 'resetYes') { closeModal(); opts.resetAll(); }
      else if (m === 'newRoundYes') { const p = part(); S.learn[p] = freshLearn(p); closeModal(); showTab('tasks'); opts.save(); opts.toast('Neuer Durchgang – Antworten neu gemischt.'); }
      else if (m === 'copyNb') copyNotebook();
      else if (m === 'printNb') printNotebook();
    });
    document.addEventListener('keydown', (e) => {
      if (modal.hidden) return;
      if (e.key === 'Escape') { e.preventDefault(); closeModal(); return; }
      if (e.key === 'Tab') {
        const f = [...modal.querySelectorAll('button, [href], input, select, textarea')].filter((x) => !x.disabled);
        if (!f.length) return;
        const first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    });

    function ghsCard(key) {
      const s = C.SOLUTIONS[key], L = GHS.LABELS[key];
      if (!s || !L) return;
      const pict = (code) => `<figure><img src="${GHS.dataUri(code)}" width="64" height="64" alt="${esc(code + ': ' + GHS.PICTOGRAMS[code].name)}"><figcaption>${esc(GHS.PICTOGRAMS[code].name)}</figcaption></figure>`;
      const hazard = L.pict.length
        ? `<p class="signal"><b>Signalwort: ${esc(L.signal)}</b></p><div class="picts">${L.pict.map(pict).join('')}</div><ul class="hsatz">${L.h.map((h) => `<li><b>${h}</b> ${esc(GHS.H[h])}</li>`).join('')}</ul>`
        : `<p><b>Keine Gefahrenpiktogramme</b> – ${s.kind === 'water' || s.water ? 'kein Gefahrstoff.' : 'die Lösung ist in dieser Konzentration nicht kennzeichnungspflichtig.'}</p>`;
      openModal(`<h2 id="modalTitle">${esc(s.name)}</h2>
        <p class="formula">${esc(s.formula)} · ${esc(L.form)}</p>
        ${s.c != null ? `<p class="conc"><b>Konzentration:</b> ${esc(s.label)}</p>` : ''}
        ${hazard}
        ${L.protect ? `<p><b>Schutz:</b> ${esc(L.protect)}</p>` : ''}
        ${L.note ? `<p class="small">${esc(L.note)}</p>` : ''}
        ${s.water ? '<p class="small">Feste Modellprobe: Sie enthält typische Mengen gelöster Ionen. Echtes Wasser ist je nach Ort verschieden.</p>' : ''}
        <p class="small lk-muted">Quelle: ${esc(L.source)}.${L.derived ? ' (abgeleitet)' : ''} ${esc(GHS.NOTE)}</p>
        <div class="lk-row end"><button type="button" class="lk-btn primary" data-m="close">Schließen</button></div>`);
    }
    function confirmReset() {
      openModal(`<h2 id="modalTitle">Gesamten Lernstand zurücksetzen?</h2><p>Alle Reagenzgläser in beiden Versuchsteilen, alle gespeicherten Beobachtungen und alle Antworten werden gelöscht. Das lässt sich nicht rückgängig machen.</p><p class="small lk-muted">Nur ein Glas leeren: Glas antippen und „Spülen“.</p><div class="lk-row end"><button type="button" class="lk-btn" data-m="close">Abbrechen</button><button type="button" class="lk-btn danger" data-m="resetYes">Ja, alles zurücksetzen</button></div>`);
    }
    function openNotebook() {
      openModal(`${notebookHtml().replace('<h2>', '<h2 id="modalTitle">')}<div class="lk-row end" style="margin-top:10px"><button type="button" class="lk-btn small" data-m="copyNb">Text kopieren</button><button type="button" class="lk-btn small" data-m="printNb">Drucken</button><button type="button" class="lk-btn primary" data-m="close">Schließen</button></div>`);
    }
    function notebookPlain() {
      const nb = T.NOTEBOOK;
      return [nb.title, ...nb.blocks.map((b) => (b.kind === 'eq' ? `${b.text}, ${b.legend}` : b.text.replace(/\*\*/g, '')))].join('\n\n');
    }
    function copyNotebook() {
      const txt = notebookPlain();
      const done = () => opts.toast('Hefteintrag kopiert.');
      const fallback = () => { const ta = document.createElement('textarea'); ta.value = txt; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; } ta.remove(); opts.toast(ok ? 'Hefteintrag kopiert.' : 'Kopieren ist hier nicht möglich – bitte abschreiben.'); };
      try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, fallback); else fallback(); } catch (e) { fallback(); }
    }
    function printNotebook() {
      const area = document.getElementById('printArea');
      area.innerHTML = notebookHtml();
      try { root.print(); } catch (e) { /* Drucken nicht verfügbar */ }
    }

    return {
      state: S, render, tick, showTab, ghsCard, openNotebook, closeModal, openModal, addsText, part,
      isModalOpen: () => !modal.hidden
    };
  }

  FL.ui = { create, freshState, freshLearn, sanitize, addsText, PTABS };
})(typeof self !== 'undefined' ? self : this);

</script>
  <script data-src="js/app.js">
/*
 * Fällungslabor – Start, Bühne und Bedienleiste
 *
 * Verbindet Modell (model.js), Renderer (render.js) und Bedienfeld (ui.js):
 *  - unsichtbare HTML-Schaltflächen über Flaschen und Reagenzgläsern (Tab, Enter/Leertaste, ≥ 44 px)
 *  - Pipette: Antippen = 1 Tropfen, Halten = begrenzte Tropfenfolge; Ende bei pointerup,
 *    pointercancel, Verlust der Zeigererfassung, Fokusverlust und verborgenem Tab. Kein Vorgang
 *    wird doppelt durch Touch- und Maus-/Klickereignisse ausgelöst (nur Pointer-Ereignisse, Klick
 *    nur für Tastatur/Hilfsmittel ohne Zeiger).
 *  - Pipette ziehen (optional): auf ein Glas = Ziel wählen, auf eine Vorratsflasche = abgewiesen.
 *  - Sitzungsstand in sessionStorage (Neuladen behält den Versuch, Labkit-Regel), Darstellung
 *    (Hintergrund, Breite des Bedienfelds) in localStorage; Speicherfehler werden abgefangen.
 */
(function (root) {
  'use strict';
  const FL = root.FL, C = FL.chem, G = FL.geometry, M = FL.model, GHS = FL.ghs, LK = root.LK;
  const VERSION = '1.1.0';
  const KEY = 'sivex.faellungslabor.session.v1';
  const PREF = 'sivex.faellungslabor.prefs';
  const $ = (id) => document.getElementById(id);
  const esc = LK.learn.esc;

  // ---------------------------------------------------------------- Speicher (fehlertolerant)
  const store = {
    get(area, k) { try { const s = root[area].getItem(k); return s ? JSON.parse(s) : null; } catch (e) { return null; } },
    set(area, k, v) { try { root[area].setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
    del(area, k) { try { root[area].removeItem(k); } catch (e) { /* ohne Speicher */ } }
  };
  const saved = store.get('sessionStorage', KEY);
  const prefs = Object.assign({ theme: 'dark' }, store.get('localStorage', PREF) || {});

  const lab = M.create(saved && saved.lab);
  const canvas = $('lab');
  const renderer = new FL.LabRenderer(canvas, lab, $('fx'));
  const reduce = root.matchMedia ? root.matchMedia('(prefers-reduced-motion: reduce)') : null;
  function applyMotion(on) { renderer.reduceMotion = on; lab.setReducedMotion(on); document.body.classList.toggle('reduce-motion', on); }
  applyMotion(!!(reduce && reduce.matches));
  if (reduce && reduce.addEventListener) reduce.addEventListener('change', (e) => applyMotion(e.matches));

  let dirty = false;
  function save() { dirty = true; }
  function flush() {
    if (!dirty) return;
    dirty = false;
    store.set('sessionStorage', KEY, { v: 1, version: VERSION, lab: lab.snapshot(), ui: ui.state });
  }

  // ---------------------------------------------------------------- Meldungen
  const toastEl = $('toast');
  let toastTimer = null;
  function toast(text, ms) {
    toastEl.textContent = text; toastEl.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms || 3200);
  }
  const forbidEl = $('forbid');
  let forbidTimer = null;
  function showForbidden(e) {
    $('forbidText').textContent = e.text;
    $('forbidReason').textContent = e.reason ? ' ' + e.reason : '';
    const p = renderer.toScreen(e.x, e.y);
    const wrap = $('canvasWrap').getBoundingClientRect();
    forbidEl.hidden = false;
    const bw = forbidEl.offsetWidth, bh = forbidEl.offsetHeight;
    forbidEl.style.left = Math.max(6, Math.min(wrap.width - bw - 6, p.x - 22)) + 'px';
    forbidEl.style.top = Math.max(6, Math.min(wrap.height - bh - 6, p.y - bh - 18)) + 'px';
    forbidEl.classList.remove('wiggle'); void forbidEl.offsetWidth;
    if (!renderer.reduceMotion) forbidEl.classList.add('wiggle');
    clearTimeout(forbidTimer); forbidTimer = setTimeout(() => { forbidEl.hidden = true; }, 3000);
  }

  // ---------------------------------------------------------------- Bedienfeld
  const ui = FL.ui.create({ lab, saved: saved && saved.ui, save, toast, resetAll });
  $('ver').textContent = VERSION;

  function resetAll() {
    store.del('sessionStorage', KEY);
    const fresh = M.create();
    Object.assign(lab.state, fresh.state, { worldW: lab.state.worldW, events: [] });
    // Zustand des Bedienfelds frisch, Darstellung (Hintergrund, Breite) bleibt
    const f = FL.ui.freshState();
    for (const k of Object.keys(ui.state)) delete ui.state[k];
    Object.assign(ui.state, f);
    renderer.fx = {}; renderer._key = null; renderer.bg = null;
    syncPart(); ui.render(); save(); flush();
    toast('Alles zurückgesetzt – beide Versuchsteile beginnen neu.');
  }

  // ---------------------------------------------------------------- Hintergrund hell/dunkel
  function applyTheme(t) {
    prefs.theme = t === 'light' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', prefs.theme);
    renderer.setTheme(prefs.theme);
    const b = $('btnTheme');
    b.textContent = prefs.theme === 'dark' ? 'Hintergrund: dunkel' : 'Hintergrund: hell';
    b.setAttribute('aria-pressed', String(prefs.theme === 'light'));
    store.set('localStorage', PREF, prefs);
  }
  $('btnTheme').addEventListener('click', () => applyTheme(prefs.theme === 'dark' ? 'light' : 'dark'));
  applyTheme(prefs.theme);

  // ---------------------------------------------------------------- Kopfzeile
  function syncPart() {
    document.querySelectorAll('#parts [data-part]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.part === lab.state.tab)));
    document.body.dataset.part = lab.state.tab;
    hitsKey = ''; labelsKey = ''; deckSig = '';
  }
  $('parts').addEventListener('click', (e) => {
    const b = e.target.closest('[data-part]');
    if (!b) return;
    if (lab.setTab(b.dataset.part)) { syncPart(); ui.render(); save(); }
  });
  $('parts').addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    const id = lab.state.tab === 'main' ? 'control' : 'main';
    if (lab.setTab(id)) { syncPart(); ui.render(); save(); $('part-' + id).focus(); }
  });
  $('btnNotebook').addEventListener('click', () => ui.openNotebook());
  $('btnPanel').addEventListener('click', () => {
    const m = $('main');
    const hidden = m.classList.toggle('panel-hidden');
    $('btnPanel').setAttribute('aria-expanded', String(!hidden));
    renderer._key = null;
  });
  LK.splitter.bindSplitter({ splitter: $('splitter'), container: $('main'), panel: $('panel'), storageKey: 'sivex.faellungslabor.panel', onChange: () => { renderer._key = null; } });

  // ---------------------------------------------------------------- Treffflächen und Etiketten
  const hits = $('hits'), labels = $('labels');
  let hitsKey = '', labelsKey = '';
  const solName = (k) => C.SOLUTIONS[k].name;
  function tubeLabel(i) {
    const t = lab.tube(i);
    if (!(t.V > 0)) return `Reagenzglas ${i + 1}, leer`;
    return `Reagenzglas ${i + 1}, Ansatz ${t.ansatz}: ${ui.addsText(t)}, ${C.fmt(t.V, 2)} mL`;
  }
  function layoutHits() {
    const st = lab.state, tb = lab.tab(), keys = M.TABS[st.tab].bottles, v = renderer.view;
    const key = [st.tab, tb.visible, v.scale, v.ox, v.oy, v.worldW, st.pip.key, st.pip.tab, st.pip.phase, st.pip.phase === 'over' ? st.pip.over : '', Math.round(st.pip.x)].join('|');
    if (key === hitsKey) return;
    hitsKey = key;
    let html = '';
    const L = lab.layout(), info = [];
    keys.forEach((k) => {
      const bt = L.bottles[k], x = bt.x;
      const a = renderer.toScreen(x, G.SHELF_Y - bt.h - G.BOTTLE.neckH - G.PIPETTE_LEN);
      const b = renderer.toScreen(x, G.SHELF_Y);
      const w = bt.wpx + 4, h = Math.max(44, b.y - a.y);
      const held = st.pip.key === k && st.pip.tab === st.tab;
      html += `<button type="button" class="hit bottle" data-bottle="${k}" aria-pressed="${held}" aria-label="${esc((held ? 'Pipette zurückstellen: ' : 'Pipette aufnehmen: ') + solName(k))}" style="left:${b.x - w / 2}px;top:${b.y - h}px;width:${w}px;height:${h}px"></button>`;
      // Infoleiste unten auf dem Etikett: Piktogramme + i; öffnet die Karte mit Konzentration und Gefahrstoffhinweisen
      const picts = (GHS.LABELS[k] || { pict: [] }).pict, ps = L.compact ? 15 : 18;
      info.push(`<button type="button" class="hit binfo" data-info="${k}" aria-label="${esc('Infokarte: ' + solName(k) + ' – Konzentration und Gefahrstoffkennzeichnung')}" style="left:${b.x - bt.wpx / 2}px;top:${b.y - 2 - 26}px;width:${bt.wpx}px;height:44px"><span class="strip">${picts.map((c) => `<img src="${GHS.dataUri(c)}" width="${ps}" height="${ps}" alt="">`).join('')}<span class="i" aria-hidden="true">i</span></span></button>`);
    });
    for (let i = 0; i < tb.visible; i++) {
      const x = lab.tubePos(i);
      const a = renderer.toScreen(x - G.TUBE_R - 14, G.RIM_Y - 14);
      const b = renderer.toScreen(x + G.TUBE_R + 14, G.INNER_BOTTOM + 14);
      const w = Math.max(44, b.x - a.x), h = Math.max(44, b.y - a.y);
      html += `<button type="button" class="hit tube" data-slot="${i}" aria-label="${esc(tubeLabel(i))}" style="left:${(a.x + b.x) / 2 - w / 2}px;top:${a.y}px;width:${w}px;height:${h}px"></button>`;
    }
    // Infoleisten vor der Pipette: die aufgenommene Pipette liegt sichtbar und bedienbar obenauf
    html += info.join('');
    const p = st.pip;
    if (p.key && p.tab === st.tab && (p.phase === 'held' || p.phase === 'over')) {
      const a = renderer.toScreen(p.x - 16, p.y - G.PIPETTE_LEN - 40), b = renderer.toScreen(p.x + 16, p.y - 30);
      const w = Math.max(44, b.x - a.x), h = Math.max(60, b.y - a.y);
      html += `<button type="button" class="hit pip" aria-label="${esc('Pipette der ' + solName(p.key) + ' zurückstellen (oder ziehen)')}" style="left:${(a.x + b.x) / 2 - w / 2}px;top:${a.y}px;width:${w}px;height:${h}px"></button>`;
    }
    hits.innerHTML = html;
  }
  function updateTubeAria() {
    hits.querySelectorAll('.hit.tube').forEach((b) => { const l = tubeLabel(+b.dataset.slot); if (b.getAttribute('aria-label') !== l) b.setAttribute('aria-label', l); b.setAttribute('aria-pressed', String(lab.tab().sel === +b.dataset.slot)); });
  }
  function layoutLabels() {
    const st = lab.state, tb = lab.tab(), keys = M.TABS[st.tab].bottles, v = renderer.view;
    const texts = [];
    for (let i = 0; i < tb.visible; i++) { const t = tb.tubes[i]; texts.push(t.ansatz || '', t.sample || '', t.V.toFixed(3), t.log.agDrops, t.log.nh3dilV.toFixed(2), t.log.nh3concV.toFixed(2), t.log.waterV.toFixed(2)); }
    const key = [st.tab, tb.visible, v.scale, v.ox, v.oy, v.w, v.h, st.pour ? st.pour.slot : ''].join('|') + '#' + texts.join(',');
    if (key === labelsKey) return;
    labelsKey = key;
    let html = '';
    const L = lab.layout(), sy = renderer.toScreen(0, G.SHELF_Y).y;
    keys.forEach((k) => {
      // Etikett in festen Bildschirmpixeln: Formel groß, Name, Zusatz – ohne Konzentration (die steht in der Infokarte)
      const bt = L.bottles[k], tx = FL.render.bottleText(k), x = renderer.toScreen(bt.x, 0).x;
      const big = tx.f ? `<span class="f">${esc(tx.f)}</span>` : '';
      const name = tx.n ? `<span class="n${tx.f ? '' : ' big'}">${esc(tx.n)}</span>` : '';
      const q = tx.q ? `<span class="q">${esc(tx.q)}</span>` : '';
      html += `<div class="bcard${L.compact ? ' compact' : ''}${k === 'agno3' ? ' brown' : ''}" data-card="${k}" aria-hidden="true" style="left:${x - bt.wpx / 2}px;top:${sy - 2 - bt.hpx}px;width:${bt.wpx}px;height:${bt.hpx}px">${big}${name}${q}</div>`;
    });
    // Gruppenüberschriften unter dem Regal
    L.groups.forEach((g) => {
      const a = Math.max(2, renderer.toScreen(g.x0, 0).x - 9), b = Math.min(v.w - 2, renderer.toScreen(g.x1, 0).x + 9);
      html += `<div class="ghead${L.compact ? ' compact' : ''}" data-group="${esc(g.title)}" style="left:${a}px;width:${b - a}px;top:${renderer.toScreen(0, G.SHELF_Y + 16).y + 2}px">${esc(L.compact ? g.short : g.title)}</div>`;
    });
    // Silberabfall-Behälter
    const wx = renderer.toScreen(G.wasteX(tb.visible, v.worldW), G.BENCH);
    html += `<div class="wlabel" data-waste="1" style="left:${wx.x - 50}px;top:${wx.y + 3}px;width:100px"><b>Silberabfälle</b><span>Sammelbehälter</span></div>`;
    for (let i = 0; i < tb.visible; i++) {
      const t = tb.tubes[i];
      const p = renderer.toScreen(lab.tubePos(i), G.BENCH);
      const w = Math.max(96, G.TUBE_GAP * v.scale - 4);
      let inner;
      if (lab.pourBusy(st.tab, i)) inner = `<b>Glas ${i + 1}${t.ansatz ? ' · ' + esc(t.ansatz) : ''}</b><span>wird ausgegossen …</span>`;
      else if (!(t.V > 0)) inner = `<b>Glas ${i + 1}</b><span class="lk-muted">leer</span>`;
      else {
        const s = C.SOLUTIONS[t.sample];
        const extra = [];
        if (t.log.agDrops) extra.push(`AgNO₃ ${t.log.agDrops}\u00a0Tr.`);
        if (t.log.nh3dilV) extra.push(`NH₃\u00a0verd. ${C.fmt(t.log.nh3dilV, 2)}\u00a0mL`);
        if (t.log.nh3concV) extra.push(`NH₃\u00a0konz. ${C.fmt(t.log.nh3concV, 2)}\u00a0mL`);
        if (t.log.waterV) extra.push(`H₂O ${C.fmt(t.log.waterV, 2)}\u00a0mL`);
        inner = `<b>Glas ${i + 1} · ${esc(t.ansatz)}</b><span>${esc(s.short || s.name)}</span><span>${C.fmt(t.V, 2)}\u00a0mL gesamt</span><span class="adds">${esc(extra.join(' · ') || 'ohne Zugabe')}</span>`;
      }
      html += `<div class="tlabel${tb.sel === i ? ' sel' : ''}" style="left:${p.x - w / 2}px;top:${p.y + 3}px;width:${w}px">${inner}</div>`;
    }
    labels.innerHTML = html;
    // Sicherung für abweichende Systemschriften: passt ein Etikett nicht, Zusatzzeilen etwas enger setzen
    labels.querySelectorAll('.bcard').forEach((c) => { if (c.scrollHeight > c.clientHeight + 1 || c.scrollWidth > c.clientWidth + 1) c.classList.add('tight'); });
  }
  hits.addEventListener('click', (e) => { const b = e.target.closest('[data-info]'); if (b) ui.ghsCard(b.dataset.info); });

  // ---------------------------------------------------------------- Eingaben an Flaschen und Gläsern
  let lastKeyAct = 0;
  const dropMode = (slot) => { const p = lab.state.pip; return lab.ready() && p.over === slot && !M.TABS[lab.state.tab].samples.includes(p.key); };
  function tubeAct(slot, hold) {
    if (dropMode(slot)) { if (hold) lab.startHold(); else lab.dropOnce(); }
    else {
      const r = lab.target(slot);
      if (r === 'select') { lab.tab().sel = slot; save(); }
    }
    save();
  }
  hits.addEventListener('pointerdown', (e) => {
    const b = e.target.closest('.hit');
    if (!b || e.button > 0) return;
    if (b.dataset.slot != null) {
      e.preventDefault();
      try { b.setPointerCapture(e.pointerId); } catch (err) { /* ohne Erfassung */ }
      tubeAct(+b.dataset.slot, true);
    }
  });
  const endHold = () => { lab.stopHold(); };
  hits.addEventListener('pointerup', endHold);
  hits.addEventListener('pointercancel', endHold);
  hits.addEventListener('lostpointercapture', endHold);
  hits.addEventListener('click', (e) => {
    const b = e.target.closest('.hit');
    if (!b) return;
    if (b.dataset.bottle) { lab.selectBottle(b.dataset.bottle); save(); return; }
    if (b.classList.contains('pip')) { if (e.detail === 0) { lab.returnPipette(); save(); } return; }
    // Gläser reagieren auf pointerdown; ein Klick ohne Zeiger (Hilfsmittel) gilt als Antippen
    if (b.dataset.slot != null && e.detail === 0 && Date.now() - lastKeyAct > 400) tubeAct(+b.dataset.slot, false);
  });
  hits.addEventListener('keydown', (e) => {
    const b = e.target.closest('.hit.tube');
    if (!b || (e.key !== 'Enter' && e.key !== ' ')) return;
    e.preventDefault();
    lastKeyAct = Date.now();
    if (!e.repeat) tubeAct(+b.dataset.slot, true);
  });
  hits.addEventListener('keyup', (e) => { if (e.target.closest('.hit.tube') && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); lastKeyAct = Date.now(); endHold(); } });

  // Pipette ziehen (zusätzliche Bedienart; Tippen genügt immer). Antippen der Pipette stellt sie zurück.
  let drag = null;
  function dropTarget(px, py) {
    const r = $('canvasWrap').getBoundingClientRect();
    const w = renderer.toWorld(px - r.left, py - r.top);
    const tb = lab.tab();
    for (let i = 0; i < tb.visible; i++) if (Math.abs(w.x - lab.tubePos(i)) < G.TUBE_R + 26 && w.y > G.RIM_Y - 120 && w.y < G.BENCH) return { slot: i, w };
    const L = lab.layout();
    for (const k of M.TABS[lab.state.tab].bottles) { const bt = L.bottles[k]; if (Math.abs(w.x - bt.x) < bt.w / 2 + 4 && w.y > G.SHELF_Y - bt.h - 80 && w.y < G.SHELF_Y + 12) return { bottle: k, w }; }
    return { w };
  }
  hits.addEventListener('pointerdown', (e) => {
    const b = e.target.closest('.hit.pip');
    if (!b || e.button > 0) return;
    e.preventDefault();
    drag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, moved: false };
    try { b.setPointerCapture(e.pointerId); } catch (err) { /* */ }
  });
  hits.addEventListener('pointermove', (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 10) drag.moved = true;
    if (drag.moved) renderer.ghost = dropTarget(e.clientX, e.clientY).w;
  });
  hits.addEventListener('pointerup', (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const d = drag; drag = null; renderer.ghost = null;
    if (!d.moved) { lab.returnPipette(); save(); return; }
    const t = dropTarget(e.clientX, e.clientY);
    if (t.slot != null) { if (dropMode(t.slot)) lab.dropOnce(); else lab.target(t.slot); save(); }
    else if (t.bottle) lab.toBottle(t.bottle);
  });
  hits.addEventListener('pointercancel', () => { drag = null; renderer.ghost = null; });

  // Fokusverlust, verborgener Tab, Verlassen: keine Dosierung im Hintergrund
  root.addEventListener('blur', () => { lab.cancelAll(); save(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { lab.cancelAll(); save(); flush(); } });
  root.addEventListener('pagehide', () => { lab.cancelAll(); save(); flush(); });
  document.addEventListener('pointerup', endHold, true);
  document.addEventListener('pointercancel', endHold, true);

  // ---------------------------------------------------------------- Bedienleiste
  const doseRow = $('doseRow'), hint = $('deckHint');
  let deckSig = '';
  function deckState() {
    const st = lab.state, p = st.pip, tb = lab.tab();
    const own = p.key && p.tab === st.tab;
    const sample = own && M.TABS[st.tab].samples.includes(p.key);
    return { own, sample, key: own ? p.key : null, over: own && p.phase === 'over' ? p.over : null, phase: own ? p.phase : 'rest', sel: tb.sel, tab: st.tab, vol: st.sampleVol[st.tab] };
  }
  function renderDeck() {
    const d = deckState();
    const sig = JSON.stringify([d.tab, d.key, d.over, d.sample, d.phase === 'over' || d.phase === 'held' ? 'r' : d.phase, d.vol]);
    if (sig === deckSig) return;
    deckSig = sig;
    let html = '', h = '';
    if (!d.key) {
      html = '<span class="who">Keine Pipette in der Hand.</span>';
      h = 'Tippe eine Flasche an, um ihre Pipette aufzunehmen. ⓘ unten auf dem Etikett: Konzentration und Gefahrstoffhinweise.';
    } else {
      const name = solName(d.key), short = FL.render.shortText(d.key);
      html = `<span class="who" title="${esc('Pipette: ' + name)}"><span class="bulb" style="background:${FL.render.BULB[d.key]}"></span><span>Pipette <b>${esc(short)}</b>${d.over != null ? ` → Glas ${d.over + 1}` : ''}</span></span>`;
      if (d.sample) h = `Tippe ein leeres Reagenzglas an – die Pipette gibt ${d.vol} mL Probe ab.`;
      else if (d.over == null) h = 'Tippe das Reagenzglas an, in das du zugeben möchtest.';
      else {
        html += '<button type="button" class="lk-btn primary dropbtn" id="btnDrop" title="Antippen: 1 Tropfen · Gedrückt halten: mehrere Tropfen nacheinander">Tropfen</button>';
        html += '<button type="button" class="lk-btn small" data-dose="n5">5 Tropfen</button>';
        if (d.key !== 'agno3') html += '<button type="button" class="lk-btn small" data-dose="0.5">0,5 mL</button><button type="button" class="lk-btn small" data-dose="1">1,0 mL</button>';
        h = d.key === 'agno3' ? 'Tropfen antippen = 1 Tropfen, gedrückt halten = mehrere. Du kannst auch das Glas selbst antippen.' : 'Für größere Mengen die Dosierhilfe 0,5 mL / 1,0 mL nutzen. Danach schwenken.';
      }
      html += '<button type="button" class="lk-btn small" id="btnReturn">Pipette zurück</button>';
    }
    doseRow.innerHTML = html;
    hint.textContent = h;
    const drop = $('btnDrop');
    if (drop) {
      drop.addEventListener('pointerdown', (e) => { if (e.button > 0) return; e.preventDefault(); try { drop.setPointerCapture(e.pointerId); } catch (err) { /* */ } lab.startHold(); save(); });
      drop.addEventListener('pointerup', endHold); drop.addEventListener('pointercancel', endHold); drop.addEventListener('lostpointercapture', endHold);
      drop.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); lastKeyAct = Date.now(); if (!e.repeat) { lab.startHold(); save(); } } });
      drop.addEventListener('keyup', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); lastKeyAct = Date.now(); endHold(); } });
      drop.addEventListener('click', (e) => { if (e.detail === 0 && Date.now() - lastKeyAct > 400) { lab.dropOnce(); save(); } });
    }
  }
  doseRow.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.id === 'btnReturn') { lab.returnPipette(); save(); }
    else if (b.dataset.dose === 'n5') { lab.drops(5); save(); }
    else if (b.dataset.dose) { lab.dose(parseFloat(b.dataset.dose)); save(); }
  });
  $('vol').addEventListener('click', (e) => { const b = e.target.closest('[data-vol]'); if (b) { lab.setSampleVol(+b.dataset.vol); save(); } });
  $('speed').addEventListener('click', (e) => { const b = e.target.closest('[data-speed]'); if (b) { lab.setSpeed(+b.dataset.speed); save(); } });
  $('btnShake').addEventListener('click', () => {
    const tb = lab.tab();
    if (tb.sel == null || !lab.shake(tb.sel)) toast(tb.sel == null ? 'Tippe zuerst ein Reagenzglas an.' : 'Das Reagenzglas ist leer.');
    save();
  });
  $('btnRinse').addEventListener('click', () => {
    const tb = lab.tab();
    if (tb.sel == null) { toast('Tippe zuerst ein Reagenzglas an.'); return; }
    if (lab.state.pour) { toast('Bitte warten – ein Glas wird gerade ausgegossen.'); return; }
    const slot = tb.sel, t = tb.tubes[slot], id = t.ansatz;
    if (lab.rinse(slot)) { toast(`Glas ${slot + 1} wird in den Silberabfall ausgegossen – Ansatz ${id} bleibt in der Ergebnisübersicht.`); save(); }
    else toast('Das Reagenzglas ist schon leer.');
  });
  // „− Glas“: gewähltes Glas aus dem Ständer nehmen; gefüllt nur nach Rückfrage (dann ausgießen)
  function removeSelected(confirmed) {
    const tb = lab.tab();
    if (tb.sel == null) { toast('Tippe zuerst das Reagenzglas an, das du wegnehmen möchtest.'); return; }
    if (lab.state.pour) { toast('Bitte warten – ein Glas wird gerade ausgegossen.'); return; }
    const slot = tb.sel, t = tb.tubes[slot];
    const r = lab.removeTube(slot, confirmed);
    if (r === 'min') toast('Mindestens ein Reagenzglas bleibt im Ständer.');
    else if (r === 'confirm') {
      ui.openModal(`<h2 id="modalTitle">Glas ${slot + 1} ausgießen und wegnehmen?</h2><p>In Glas ${slot + 1} ist noch ${esc(C.fmt(t.V, 2))} mL (Ansatz ${esc(t.ansatz)}). Der Inhalt kommt in den Silberabfall, das Glas wird aus dem Ständer genommen. Ansatz ${esc(t.ansatz)} bleibt in der Ergebnisübersicht.</p><div class="lk-row end"><button type="button" class="lk-btn" data-m="close">Abbrechen</button><button type="button" class="lk-btn danger" data-m="removeYes" data-slot="${slot}">Ausgießen und wegnehmen</button></div>`);
    } else if (r === true) {
      toast(confirmed ? `Glas ${slot + 1} wird ausgegossen und dann weggenommen.` : `Leeres Glas ${slot + 1} weggenommen.`);
      save();
    }
  }
  $('btnRemoveTube').addEventListener('click', () => removeSelected(false));
  $('modal').addEventListener('click', (e) => {
    const b = e.target.closest('[data-m="removeYes"]');
    if (!b) return;
    ui.closeModal();
    const tb = lab.tab();
    if (tb.sel !== +b.dataset.slot) tb.sel = +b.dataset.slot;
    removeSelected(true);
    $('btnRemoveTube').focus();
  });
  $('btnAddTube').addEventListener('click', () => {
    if (lab.addTube()) { toast('Weiteres leeres Reagenzglas im Ständer.'); save(); }
    else toast('Der Ständer ist voll. Spüle ein Glas, um es neu zu verwenden.');
  });
  function syncControls() {
    const st = lab.state, tb = lab.tab();
    document.querySelectorAll('#speed [data-speed]').forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.speed === st.speed)));
    document.querySelectorAll('#vol [data-vol]').forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.vol === st.sampleVol[st.tab])));
    const has = tb.sel != null && tb.tubes[tb.sel] && tb.tubes[tb.sel].V > 0;
    $('btnShake').disabled = !has; $('btnRinse').disabled = !has;
    $('btnShake').setAttribute('aria-label', tb.sel != null ? `Glas ${tb.sel + 1} schwenken` : 'Schwenken (zuerst ein Glas antippen)');
    $('btnRinse').setAttribute('aria-label', tb.sel != null ? `Glas ${tb.sel + 1} spülen` : 'Glas spülen (zuerst ein Glas antippen)');
    $('btnAddTube').disabled = tb.visible >= M.TABS[st.tab].maxTubes;
    // „− Glas“ bleibt bedienbar (Hinweis bei fehlender Auswahl/Minimum), wirkt aber gedämpft
    const rm = $('btnRemoveTube'), canRm = tb.sel != null && tb.visible > 1 && !st.pour;
    rm.classList.toggle('soft-off', !canRm);
    rm.setAttribute('aria-label', tb.sel != null ? `Glas ${tb.sel + 1} aus dem Ständer nehmen` : 'Glas wegnehmen (zuerst ein Glas antippen)');
  }

  // ---------------------------------------------------------------- Hauptschleife
  let last = performance.now(), saveAt = 0;
  function loop(now) {
    const dt = Math.min(0.1, Math.max(0, (now - last) / 1000));
    last = now;
    lab.step(dt);
    for (const e of lab.drain()) {
      if (e.type === 'land') { renderer.onLand(e); save(); }
      else if (e.type === 'forbidden') showForbidden(e);
      else if (e.type === 'full') toast(e.text);
      else if (e.type === 'toast') toast(e.text);
      else if (e.type === 'removed') { for (const k of Object.keys(renderer.fx)) if (k.indexOf(e.tab) === 0) delete renderer.fx[k]; hitsKey = ''; labelsKey = ''; save(); }
      else if (e.type === 'poured') { if (e.tab === lab.state.tab) delete renderer.fx[e.tab + e.slot]; save(); }
    }
    renderer.frame(dt);
    layoutHits(); updateTubeAria(); layoutLabels(); renderDeck(); syncControls(); ui.tick();
    if (now - saveAt > 1500) { saveAt = now; flush(); }
    root.requestAnimationFrame(loop);
  }

  syncPart();
  ui.render();
  if (ui.state.migrated) { delete ui.state.migrated; save(); setTimeout(() => toast('Gespeicherte Antworten aus Version 1.0 übernommen – die Antwortmöglichkeiten sind jetzt gemischt.', 5000), 300); }
  root.requestAnimationFrame((t) => { last = t; loop(t); });

  // Zugriff für Tests (nur lesen) und Fehlersuche
  FL.app = { lab, renderer, ui, version: VERSION, toast, save, flush, resetAll, store, KEY };
})(typeof self !== 'undefined' ? self : this);

</script>
</body>
