<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b2430">
  <meta name="description" content="Halbtitrationslabor: pKs- und pKB-Werte experimentell durch Halbtitration bestimmen (Essigsäure, Ammoniak, Phosphorsäure, Glycinhydrochlorid). Chemie Q13.">
  <title>Halbtitrationslabor – SiVex</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M13 3h6v9l7.5 13.2A3 3 0 0 1 23.9 30H8.1a3 3 0 0 1-2.6-4.8L13 12z' fill='%23e5effc' stroke='%231f6fd1' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="labkit/css/labkit.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="lk-app" id="app">
    <header class="lk-head">
      <div class="lk-brand">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><path d="M13 3h6v9l7.5 13.2A3 3 0 0 1 23.9 30H8.1a3 3 0 0 1-2.6-4.8L13 12z" fill="none" stroke="#9cc3ff" stroke-width="2" stroke-linejoin="round"/><path d="M8.6 22h14.8l1.9 3.4A1.6 1.6 0 0 1 23.9 28H8.1a1.6 1.6 0 0 1-1.4-2.4z" fill="#d61c84" opacity=".8"/></svg>
        <div><b>Halbtitrationslabor</b><br><small>pK-Werte experimentell bestimmen · Chemie Q13</small></div>
      </div>
      <button type="button" class="lk-btn small" data-action="notebook">Hefteintrag</button>
      <button type="button" class="lk-btn small" data-action="report">Bericht</button>
      <button type="button" class="lk-btn small" data-action="reset-menu">Zurücksetzen</button>
      <button type="button" class="lk-btn small" id="btnPanel" data-action="toggle-panel" aria-expanded="true" aria-controls="panel">Bedienfeld</button>
    </header>
    <main class="lk-main" id="main">
      <section class="lk-stage" id="stage" aria-label="Labor">
        <div class="actionbar">
          <div class="expchips" id="expChips" role="group" aria-label="Versuch wählen"></div>
          <div class="seriesbar" id="seriesBar"></div>
        </div>
        <div class="labgrid" id="labgrid">
          <div class="labarea">
            <canvas id="labCanvas" role="img" aria-label="Titrationsaufbau: Bürette am Stativ, Erlenmeyerkolben auf dem Magnetrührer, pH-Elektrode mit Messgerät"></canvas>
            <div class="msgband"><div class="toast" id="toast" role="status" aria-live="polite"></div></div>
          </div>
          <div class="chartarea">
            <div class="chart-head">
              <div class="chart-title"><strong>Titrationskurve</strong> <span id="chartSub" class="lk-muted"></span></div>
              <div class="chart-tools" id="chartTools"></div>
            </div>
            <canvas id="chart" tabindex="0" aria-label="Titrationskurve aus deinen Messpunkten; Pfeiltasten wählen Messpunkte bzw. verschieben den Marker"></canvas>
            <div class="chart-legend" id="chartLegend"></div>
            <div class="chart-foot" id="chartFoot" aria-live="polite"></div>
          </div>
        </div>
        <div class="deck" id="deck" role="group" aria-label="Vorbereitung und Dosierung"></div>
      </section>
      <div class="lk-splitter" id="splitter" role="separator" tabindex="0" aria-orientation="vertical" aria-label="Breite des Bedienfelds ändern (Pfeiltasten, Doppelklick setzt zurück)" aria-valuemin="300" aria-valuemax="620"><span class="lk-splitter-grip"></span></div>
      <aside class="lk-panel" id="panel" aria-label="Bedienfeld">
        <div class="lk-tabs" role="tablist">
          <button type="button" role="tab" data-tab="task" aria-selected="true">Aufgabe</button>
          <button type="button" role="tab" data-tab="results" aria-selected="false">Ergebnisse</button>
          <button type="button" role="tab" data-tab="notebook" aria-selected="false">Hefteintrag</button>
        </div>
        <div id="panelBody" class="lk-section" role="tabpanel"></div>
      </aside>
    </main>
  </div>
  <div class="modal" id="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
      <div class="lk-row end" id="modalActions"></div>
    </div>
  </div>
  <section class="report" id="report" aria-label="Laborbericht"></section>

  <script src="labkit/js/core.js"></script>
  <script src="labkit/js/splitter.js"></script>
  <script src="labkit/js/scorm.js"></script>
  <script src="js/model/format.js"></script>
  <script src="js/model/chemistry.js"></script>
  <script src="js/model/indicators.js"></script>
  <script src="js/model/evaluation.js"></script>
  <script src="js/experiment/lab.js"></script>
  <script src="js/view/geometry.js"></script>
  <script src="js/view/lab-renderer.js"></script>
  <script src="js/view/chart.js"></script>
  <script src="js/ui/content.js"></script>
  <script src="js/ui/store.js"></script>
  <script src="js/ui/tasks.js"></script>
  <script src="js/ui/app.js"></script>
</body>
</html>
