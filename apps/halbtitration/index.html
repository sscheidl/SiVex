<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16202b">
  <meta name="description" content="Halbtitrationslabor: pKs- und pKB-Werte experimentell bestimmen (Essigsäure, Ammoniak, Phosphorsäure, Glycinhydrochlorid).">
  <title>Halbtitrationslabor · pKₛ- und pK_B-Werte bestimmen</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M13 3h6v9l7.5 13.2A3 3 0 0 1 23.9 30H8.1a3 3 0 0 1-2.6-4.8L13 12z' fill='%23e9f1fe' stroke='%231f6fe5' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M13 3h6v9l7.5 13.2A3 3 0 0 1 23.9 30H8.1a3 3 0 0 1-2.6-4.8L13 12z" fill="none" stroke="#9cc3ff" stroke-width="2" stroke-linejoin="round"/><path d="M8.6 22h14.8l1.9 3.4A1.6 1.6 0 0 1 23.9 28H8.1a1.6 1.6 0 0 1-1.4-2.4z" fill="#d61c84" opacity=".8"/></svg>
        <div>
          <strong>Halbtitrationslabor</strong>
          <small>pKₛ- und pK<sub>B</sub>-Werte experimentell bestimmen</small>
        </div>
      </div>
      <nav class="phases" aria-label="Arbeitsphasen">
        <button type="button" class="phase" data-view="theory"><span>1</span>Theorie</button>
        <button type="button" class="phase" data-view="plan"><span>2</span>Planung</button>
        <button type="button" class="phase" data-view="lab"><span>3</span>Labor</button>
        <button type="button" class="phase" data-view="eval"><span>4</span>Auswertung</button>
      </nav>
      <div class="top-actions">
        <span class="exp-chip" id="expChip"></span>
        <button type="button" class="tb" data-action="notebook" title="Zusammenfassung zum Abschreiben">Hefteintrag</button>
        <button type="button" class="tb" data-action="report" title="Laborbericht drucken oder als PDF speichern">Bericht</button>
        <button type="button" class="tb" data-action="reset-menu" aria-haspopup="dialog">Zurücksetzen</button>
      </div>
    </header>

    <main class="main">
      <!-- 1 Theorie -->
      <section class="view doc-view" id="view-theory" data-view-panel="theory" aria-label="Theorie" hidden>
        <div class="doc" id="theoryDoc"></div>
      </section>

      <!-- 2 Planung -->
      <section class="view doc-view" id="view-plan" data-view-panel="plan" aria-label="Planung" hidden>
        <div class="doc" id="planDoc"></div>
      </section>

      <!-- 3 Labor -->
      <section class="view split-view" id="view-lab" data-view-panel="lab" aria-label="Labor" hidden>
        <div class="stage" id="labStage">
          <div class="lab-wrap">
            <canvas id="labCanvas" role="img" aria-label="Titrationsaufbau: Bürette am Stativ, Erlenmeyerkolben auf dem Magnetrührer, pH-Elektrode mit Messgerät"></canvas>
          </div>
          <div class="chart-card" id="labChartCard">
            <div class="chart-head">
              <div><strong>Titrationskurve</strong> <span class="chart-sub" id="labChartSub"></span></div>
              <div class="chart-tools">
                <label class="chk"><input type="checkbox" id="labBand"> Umschlagsbereich</label>
                <button type="button" class="mini" data-action="xmode" data-target="lab" id="labXMode">0–50 mL</button>
              </div>
            </div>
            <canvas id="labChart" tabindex="0" aria-label="Titrationskurve der aktiven Messreihe; Pfeiltasten wählen Messpunkte"></canvas>
            <div class="chart-legend" id="labLegend"></div>
          </div>
        </div>
        <div class="splitter" id="labSplitter" role="separator" aria-orientation="vertical" aria-label="Breite des Bedienfelds" tabindex="0"><span class="splitter-grip"></span></div>
        <aside class="panel" id="labPanel" aria-label="Bedienfeld Labor"></aside>
      </section>

      <!-- 4 Auswertung -->
      <section class="view split-view" id="view-eval" data-view-panel="eval" aria-label="Auswertung" hidden>
        <div class="stage eval-stage">
          <div class="chart-card big">
            <div class="chart-head">
              <div><strong>Auswertung an der eigenen Kurve</strong> <span class="chart-sub" id="evalChartSub"></span></div>
              <div class="chart-tools" id="evalTools"></div>
            </div>
            <canvas id="evalChart" tabindex="0" aria-label="Titrationskurve zur Auswertung; im Markermodus verschieben Pfeiltasten den aktiven Marker"></canvas>
            <div class="chart-legend" id="evalLegend"></div>
            <div class="chart-foot" id="evalFoot" aria-live="polite"></div>
          </div>
          <div class="data-card" id="evalData"></div>
        </div>
        <div class="splitter" id="evalSplitter" role="separator" aria-orientation="vertical" aria-label="Breite des Laborjournals" tabindex="0"><span class="splitter-grip"></span></div>
        <aside class="panel journal" id="journal" aria-label="Laborjournal"></aside>
      </section>
    </main>

    <div class="toast-area" id="toastArea" aria-live="polite"></div>
    <div class="modal" id="modal" hidden>
      <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <h2 id="modalTitle"></h2>
        <div id="modalBody"></div>
        <div class="modal-actions" id="modalActions"></div>
      </div>
    </div>
  </div>
  <section class="report" id="report" aria-label="Laborbericht"></section>

  <script src="js/scorm.js"></script>
  <script src="js/model/format.js"></script>
  <script src="js/model/chemistry.js"></script>
  <script src="js/model/indicators.js"></script>
  <script src="js/model/evaluation.js"></script>
  <script src="js/experiment/lab.js"></script>
  <script src="js/view/geometry.js"></script>
  <script src="js/view/lab-renderer.js"></script>
  <script src="js/view/chart.js"></script>
  <script src="js/ui/content.js"></script>
  <script src="js/ui/store.js"></script>
  <script src="js/ui/journal.js"></script>
  <script src="js/ui/app.js"></script>
</body>
</html>
