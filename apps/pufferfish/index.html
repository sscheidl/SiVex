<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pufferfish – SiVex</title>
  <meta name="description" content="Pufferfish – Warum bleibt der pH fast gleich? Virtuelles Labor zu Puffern: Pufferwirkung untersuchen, Henderson-Hasselbalch herleiten, Puffer berechnen, herstellen und messen (Chemie Q13, erhöhtes Anforderungsniveau).">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='33' r='20' fill='%23f2c14e' stroke='%23b07d12' stroke-width='3'/%3E%3Ccircle cx='40' cy='27' r='6' fill='%23fff'/%3E%3Ccircle cx='41' cy='27' r='3' fill='%23132a3a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="labkit/css/labkit.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="lk-app">
    <header class="lk-head">
      <div class="lk-brand">
        <button type="button" class="logo" id="logo" aria-label="Pufferfish-Logo: Fisch aufpumpen lassen" title="Antippen: Der Pufferfisch pumpt sich auf">
          <svg viewBox="0 0 64 64" aria-hidden="true" focusable="false">
            <g class="pf-fish">
              <path class="pf-tail" d="M14 32 L4 23 Q6 32 4 41 Z" fill="#e8a93a" stroke="#9a6a10" stroke-width="1.6" stroke-linejoin="round"/>
              <g class="pf-spikes" fill="#e3b04a" stroke="#9a6a10" stroke-width="1.1" stroke-linejoin="round">
                <g transform="rotate(-80 34 32)"><path d="M32 18 L34 11 L36 18 Z"/></g>
                <g transform="rotate(-45 34 32)"><path d="M32 18 L34 11 L36 18 Z"/></g>
                <g transform="rotate(-10 34 32)"><path d="M32 18 L34 11 L36 18 Z"/></g>
                <g transform="rotate(25 34 32)"><path d="M32 18 L34 11 L36 18 Z"/></g>
                <g transform="rotate(110 34 32)"><path d="M32 18 L34 11 L36 18 Z"/></g>
                <g transform="rotate(145 34 32)"><path d="M32 18 L34 11 L36 18 Z"/></g>
                <g transform="rotate(180 34 32)"><path d="M32 18 L34 11 L36 18 Z"/></g>
                <g transform="rotate(215 34 32)"><path d="M32 18 L34 11 L36 18 Z"/></g>
                <g transform="rotate(250 34 32)"><path d="M32 18 L34 11 L36 18 Z"/></g>
              </g>
              <g class="pf-body">
                <circle cx="34" cy="32" r="15" fill="#f2c14e" stroke="#9a6a10" stroke-width="1.8"/>
                <ellipse cx="34" cy="38" rx="11" ry="6.5" fill="#fbe6a6"/>
                <circle cx="27" cy="27" r="1.6" fill="#c98f1c"/><circle cx="31" cy="22" r="1.3" fill="#c98f1c"/><circle cx="24" cy="33" r="1.2" fill="#c98f1c"/>
                <ellipse class="pf-cheek" cx="43" cy="35" rx="3" ry="1.8" fill="#f08a7a" opacity=".55"/>
              </g>
              <path class="pf-fin" d="M30 36 Q24 41 26 45 Q31 42 33 37 Z" fill="#e8a93a" stroke="#9a6a10" stroke-width="1.2" stroke-linejoin="round"/>
              <g class="pf-eye"><circle cx="40" cy="27" r="5" fill="#fff" stroke="#9a6a10" stroke-width="1.2"/><circle class="pf-pupil" cx="41.3" cy="27.4" r="2.5" fill="#132a3a"/><circle cx="42.2" cy="26.4" r=".8" fill="#fff"/></g>
              <g class="pf-brow"><path d="M36.5 20.5 Q40 19 43.5 21" fill="none" stroke="#7a520c" stroke-width="1.3" stroke-linecap="round"/></g>
              <ellipse class="pf-mouth" cx="48.6" cy="33.5" rx="1.6" ry="1.3" fill="#7a2e22"/>
            </g>
          </svg>
        </button>
        <div><b>Pufferfish</b><br><small>Warum bleibt der pH fast gleich? · Chemie Q13</small></div>
      </div>
      <nav class="steps" id="steps" aria-label="Lernweg">
        <button type="button" data-page="lab" aria-current="page"><span>1</span> Labor</button>
        <button type="button" data-page="theory"><span>2</span> Herleitung</button>
        <button type="button" data-page="tasks"><span>3</span> Rechnen</button>
        <button type="button" data-page="apps"><span>4</span> Anwendungen</button>
      </nav>
      <button type="button" class="lk-btn small" id="btnNotebook">Hefteintrag</button>
      <button type="button" class="lk-btn small" id="btnMotion" aria-pressed="false" title="Dekorative Bewegungen reduzieren (Chemie und Messwerte bleiben gleich)">Weniger Bewegung</button>
      <button type="button" class="lk-btn small" id="btnPanel" aria-expanded="true" aria-controls="panel">Bedienfeld</button>
    </header>
    <main class="lk-main" id="main">
      <section class="lk-stage" id="stage" aria-label="Labor">
        <div class="actionbar">
          <div class="expchips" id="expChips" role="group" aria-label="Versuch wählen"></div>
          <div class="seriesbar" id="seriesBar">
            <button type="button" class="lk-btn small" id="btnNewSeries" title="Aktuelle Reihe speichern und frische Ansätze aufstellen">Neue Reihe</button>
            <button type="button" class="lk-btn small" id="btnCont" title="Dieselben (bereits behandelten) Ansätze mit der anderen Lösung weiterbehandeln">Gegenprobe</button>
            <button type="button" class="lk-btn small" id="btnBatch" title="Leeres Becherglas aufstellen (bisherige Messungen bleiben gespeichert)" hidden>Neu ansetzen</button>
          </div>
        </div>
        <div class="formulabar" id="formulaBar" role="note" aria-label="Henderson-Hasselbalch-Gleichung" hidden></div>
        <div class="labgrid" id="labgrid">
          <div class="labarea">
            <div class="canvas-wrap" id="canvasWrap">
              <canvas id="lab" role="img" aria-label="Laborbank mit Bechergläsern, Pipetten, Lösungsflaschen und pH-Messelektroden"></canvas>
              <div class="tags" id="tags"></div>
              <p class="seriesnote" id="seriesNote"></p>
              <div class="msgband"><div class="toast" id="toast" role="status" aria-live="polite"></div></div>
            </div>
          </div>
          <div class="deck" id="deck" role="group" aria-label="Dosierleiste">
            <div class="deck-row dosebar" id="doseBar"></div>
            <p class="deck-hint" id="deckHint" role="status"></p>
            <div class="deck-row util">
              <button type="button" class="lk-btn small stir" id="btnStir">Umrühren</button>
              <div class="grp" role="group" aria-label="Zeit">
                <div class="lk-seg light" id="speed">
                  <button type="button" data-speed="0" aria-label="Pause" title="Pause">❚❚</button>
                  <button type="button" data-speed="0.25" aria-label="langsam, viertel Geschwindigkeit" title="Langsam (¼×)">¼×</button>
                  <button type="button" data-speed="1" aria-label="normale Geschwindigkeit">1×</button>
                </div>
                <button type="button" class="lk-btn small" id="btnStep" title="Im Pausenmodus einen kleinen Zeitschritt weiter">Schritt ▸</button>
              </div>
              <label class="chk" id="indWrap"><input type="checkbox" id="chkIndicator" checked> Indikatorfarbe</label>
              <div class="uiscale" id="uiScale" aria-label="Universalindikator, schematische Farbskala"><span>Universalindikator<br>(schematisch)</span><div class="uibar" id="uiBar"></div></div>
            </div>
          </div>
          <div class="extra" id="extra">
            <div class="extra-head">
              <div class="viewtoggle" id="viewToggle" role="group" aria-label="Zusatzansicht wählen">
                <button type="button" data-view="main" aria-pressed="true">Teilchenmodell</button>
                <button type="button" data-view="curve" aria-pressed="false">pH-Kurve</button>
              </div>
              <h2 id="extraTitle" class="extra-title"></h2>
              <p id="extraNote" class="extra-note"></p>
              <div class="chartctl" id="chartCtl" hidden>
                <label class="chk"><input type="checkbox" id="chkZoom"> Ausschnitt</label>
                <label class="chk" id="pkaWrap"><input type="checkbox" id="chkPka"> pKₛ ± 1</label>
                <select id="cmpSelect" aria-label="Frühere Messreihe zum Vergleich einblenden"></select>
              </div>
            </div>
            <div class="extra-body">
              <div class="partview" id="partview">
                <div class="plegend" id="plegend"></div>
                <div class="pviews" id="pviews"></div>
              </div>
              <div class="mixview" id="mixview" hidden></div>
              <div class="chartbox" id="chartbox" hidden>
                <div class="chartwrap"><canvas id="chart" role="img" aria-label="Diagramm: pH gegen zugegebenes Volumen"></canvas></div>
                <div class="chartlegend" id="chartLegend"></div>
              </div>
            </div>
          </div>
        </div>
      </section>
      <div class="lk-splitter" id="splitter" role="separator" tabindex="0" aria-orientation="vertical" aria-label="Breite des Bedienfelds ändern (Pfeiltasten, Doppelklick setzt zurück)" aria-valuemin="300" aria-valuemax="620"><span class="lk-splitter-grip"></span></div>
      <aside class="lk-panel" id="panel" aria-label="Bedienfeld">
        <div class="lk-tabs" role="tablist">
          <button type="button" role="tab" data-tab="task" aria-selected="true">Aufgabe</button>
          <button type="button" role="tab" data-tab="results" aria-selected="false">Ergebnisse</button>
          <button type="button" role="tab" data-tab="journal" aria-selected="false">Journal</button>
          <button type="button" role="tab" data-tab="notebook" aria-selected="false">Hefteintrag</button>
        </div>
        <div id="panelBody" class="lk-section" role="tabpanel"></div>
      </aside>
      <div class="page" id="page" hidden><div class="page-inner" id="pageBody"></div></div>
    </main>
  </div>
  <div class="print-only" id="printArea"></div>
  <script src="labkit/js/core.js"></script>
  <script src="labkit/js/splitter.js"></script>
  <script src="labkit/js/scorm.js"></script>
  <script src="js/chem.js"></script>
  <script src="js/geometry.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/learn.js"></script>
  <script src="js/render-lab.js"></script>
  <script src="js/render-particles.js"></script>
  <script src="js/render-mix.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
