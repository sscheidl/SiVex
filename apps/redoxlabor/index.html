<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#16202b">
  <meta name="description" content="Virtuelles Redoxlabor: Fehling- und Tollens-Probe mit Aldehyden und Ketonen – interaktiv experimentieren, beobachten, protokollieren und Redoxgleichungen erarbeiten.">
  <title>Redoxlabor – Fehling- und Tollens-Probe</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M12 3h8v2h-1v9l7 12a3 3 0 0 1-2.6 4.5H8.6A3 3 0 0 1 6 26l7-12V5h-1z' fill='%231f6fe5'/%3E%3Cpath d='M9 22h14l2 4H7z' fill='%23d4572c'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M12 3h8v2h-1v9l7 12a3 3 0 0 1-2.6 4.5H8.6A3 3 0 0 1 6 26l7-12V5h-1z" fill="#3d8bfd"/><path d="M9 22h14l2 4H7z" fill="#e0703c"/></svg>
      <div><strong>Redoxlabor</strong><small>Fehling- &amp; Tollens-Probe</small></div>
    </div>
    <div class="seg mode-switch" role="radiogroup" aria-label="Modus">
      <button type="button" role="radio" data-mode="learn">Lernmodus</button>
      <button type="button" role="radio" data-mode="analysis">Analysemodus</button>
    </div>
    <nav class="top-actions" aria-label="Werkzeuge">
      <button type="button" id="btnHelp" class="tb"><span class="ic">?</span><span class="lbl">Hilfe</span></button>
      <button type="button" id="btnEval" class="tb"><span class="ic">✎</span><span class="lbl">Auswertung</span><span class="badge" id="evalBadge" hidden>0</span></button>
      <button type="button" id="btnRedox" class="tb"><span class="ic">e⁻</span><span class="lbl">Redox-Trainer</span></button>
      <button type="button" id="btnRestart" class="tb"><span class="ic">↺</span><span class="lbl">Neustart</span></button>
    </nav>
  </header>

  <main class="layout">
    <section class="stage" id="stage">
      <canvas id="lab" role="img" aria-label="Virtueller Labortisch mit Reagenzien, Stoffproben, Reagenzglasständer, Wasserbad, Gasbrenner und Lupe"></canvas>
      <div class="toasts" id="toasts" aria-live="polite"></div>
      <div class="help-pop" id="helpPop" hidden>
        <div class="help-head"><strong>Hilfe</strong><span id="helpContext"></span><button type="button" class="x" id="helpClose" aria-label="Hilfe schließen">×</button></div>
        <ol class="help-levels" id="helpLevels"></ol>
        <div class="help-foot"><button type="button" id="helpMore" class="btn primary">Hilfe 1 – Denkimpuls</button></div>
      </div>
    </section>
    <aside class="panel" id="panel" aria-label="Bedienfeld"></aside>
  </main>

  <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
  <section class="drawer" id="drawer" hidden aria-label="Auswertung">
    <header class="drawer-head">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-tab="protocol">Protokoll</button>
        <button type="button" role="tab" data-tab="overview">Ergebnisübersicht</button>
        <button type="button" role="tab" data-tab="redox">Redox-Trainer</button>
      </div>
      <button type="button" class="x" id="drawerClose" aria-label="Auswertung schließen">×</button>
    </header>
    <div class="drawer-body" id="drawerBody"></div>
  </section>

  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" id="modalBox"></div>
  </div>

  <noscript><p class="noscript">Das Redoxlabor benötigt JavaScript.</p></noscript>

  <script src="js/scorm.js"></script>
  <script src="js/chemistry.js"></script>
  <script src="js/ghs.js"></script>
  <script src="js/lab.js"></script>
  <script src="js/redox.js"></script>
  <script src="js/structures.js"></script>
  <script src="js/render.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
